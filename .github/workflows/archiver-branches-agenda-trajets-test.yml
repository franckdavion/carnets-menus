name: Archiver avec sauvegarde les trois branches Agenda et Trajets

on:
  push:
    branches: [test]
    paths:
      - ".github/workflows/archiver-branches-agenda-trajets-test.yml"

permissions:
  contents: read

concurrency:
  group: archive-agenda-trajets-20261106
  cancel-in-progress: false

jobs:
  simulation:
    if: github.repository == 'franckdavion/carnets-menus' && github.ref == 'refs/heads/test'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Tester les 32 scénarios Trajets et les contrats Agenda sans accès aux données
        run: |
          node maison/tests/trajets-selection.test.mjs
          node maison/tests/trajets-core.test.mjs
          node maison/tests/agenda-contrats.test.mjs
      - name: Simulation des contrôles GitHub sans écriture
        run: node scripts/archivage-branches-agenda-trajets-20261106.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCHIVE_MODE: simulation

  archivage:
    needs: simulation
    if: github.repository == 'franckdavion/carnets-menus' && github.ref == 'refs/heads/test'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Créer et vérifier les trois tags de sauvegarde complets
        run: node scripts/archivage-branches-agenda-trajets-20261106.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCHIVE_MODE: archivage
          ARCHIVE_CONFIRMATION: ARCHIVER-TROIS-BRANCHES-20261106

  rangement:
    needs: archivage
    if: github.repository == 'franckdavion/carnets-menus' && github.ref == 'refs/heads/test'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Vérifier à nouveau chaque tag puis ranger les branches historiques
        run: node scripts/archivage-branches-agenda-trajets-20261106.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCHIVE_MODE: suppression
          ARCHIVE_CONFIRMATION: ARCHIVER-TROIS-BRANCHES-20261106