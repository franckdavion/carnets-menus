<script>
// iOS / PWA : champ actif visible au-dessus du clavier, dans les pages ET les feuilles.
(() => {
  const vv = window.visualViewport;
  const sheet = document.getElementById('sheet');
  if (!vv || !sheet) return;
  const root = document.documentElement;
  const editable = el => el && el.matches('input:not([type=checkbox]):not([type=radio]):not([type=hidden]), textarea, select, [contenteditable="true"]');
  const isTouch = window.matchMedia('(pointer: coarse)').matches;
  let baselineHeight = vv.height;
  let timer;
  const activeField = () => editable(document.activeElement) ? document.activeElement : null;
  const obstruction = () => Math.max(0, baselineHeight - vv.height, window.innerHeight - vv.offsetTop - vv.height);

  function adjust() {
    const field = activeField();
    const keyboard = isTouch && !!field && obstruction() > 130;
    root.style.setProperty('--maison-vh', Math.max(180, vv.height - 12) + 'px');
    // Ne pas changer le positionnement des feuilles déjà validé.
    if (sheet.open && keyboard) {
      sheet.classList.add('maison-keyboard');
      sheet.style.top = Math.max(0, vv.offsetTop + 6) + 'px';
      sheet.style.height = Math.max(180, vv.height - 12) + 'px';
      sheet.style.maxHeight = Math.max(180, vv.height - 12) + 'px';
    } else {
      sheet.classList.remove('maison-keyboard');
      sheet.style.removeProperty('top');
      sheet.style.removeProperty('height');
      sheet.style.removeProperty('max-height');
    }
    const inline = keyboard && !sheet.open && !!field;
    root.classList.toggle('mz-inline-keyboard', inline);
    if (inline) {
      root.style.setProperty('--mz-keyboard-space', Math.min(600, Math.ceil(obstruction())) + 'px');
      root.style.setProperty('--mz-visible-bottom', Math.round(vv.offsetTop + vv.height) + 'px');
    } else {
      root.style.removeProperty('--mz-keyboard-space');
      root.style.removeProperty('--mz-visible-bottom');
      if (!field && obstruction() < 80) baselineHeight = vv.height;
    }
  }

  function showFocused() {
    adjust();
    const field = activeField();
    if (!field) return;
    if (sheet.open) {
      if (!sheet.contains(field)) return;
      const r = field.getBoundingClientRect(), b = sheet.getBoundingClientRect();
      if (r.bottom > b.bottom - 24) sheet.scrollTop += r.bottom - b.bottom + 24;
      else if (r.top < b.top + 18) sheet.scrollTop -= b.top + 18 - r.top;
      return;
    }
    if (!root.classList.contains('mz-inline-keyboard')) return;
    const r = field.getBoundingClientRect();
    // 84 px : marge pour la barre de suggestions du clavier iPhone.
    const top = vv.offsetTop + 64, bottom = vv.offsetTop + vv.height - 84;
    if (bottom - top < 100) return;
    const delta = r.bottom > bottom ? r.bottom - bottom : r.top < top ? r.top - top : 0;
    if (Math.abs(delta) > 3) window.scrollBy({ top: Math.ceil(delta), behavior: 'auto' });
  }

  vv.addEventListener('resize', () => {
    adjust();
    clearTimeout(timer);
    timer = setTimeout(showFocused, 150);
  }, { passive: true });
  vv.addEventListener('scroll', adjust, { passive: true });
  document.addEventListener('focusin', e => {
    if (!editable(e.target)) return;
    setTimeout(showFocused, 100);
    setTimeout(showFocused, 350);
    setTimeout(showFocused, 600);
  });
  document.addEventListener('input', e => {
    if (editable(e.target) && e.target.matches('textarea, [contenteditable="true"]')) requestAnimationFrame(showFocused);
  }, { passive: true });
  document.addEventListener('focusout', () => setTimeout(adjust, 300));
  sheet.addEventListener('close', adjust);
  window.addEventListener('orientationchange', () => setTimeout(() => {
    if (!activeField()) baselineHeight = vv.height;
    adjust();
    showFocused();
  }, 300));
  adjust();
})();
</script>
