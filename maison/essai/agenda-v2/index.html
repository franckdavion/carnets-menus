<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agenda V2 — Prototype</title>
<style>
:root {
  --bg: #F7F8FF;
  --surface: #FFFFFF;
  --soft: #F0F2FF;
  --line: #E8EAFF;
  --ink: #1A1D2E;
  --muted: #8890A8;
  --accent: #4C8DF6;
  --accent-soft: #EBF1FF;
  --r-sm: 12px;
  --r-md: 18px;
  --r-lg: 26px;
  --r-pill: 999px;
  --tabbar: 72px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  /* Catégories pastels */
  --cat-rva: #E8F4FF; --cat-rva-ink: #2970C4; --cat-rva-dot: #4C8DF6;
  --cat-sante: #FFF0F0; --cat-sante-ink: #C42929; --cat-sante-dot: #F65C5C;
  --cat-sport: #F0FFF4; --cat-sport-ink: #1A7A3C; --cat-sport-dot: #34C768;
  --cat-famille: #FFF8E8; --cat-famille-ink: #A05C00; --cat-famille-dot: #F6A82C;
  --cat-perso: #F5F0FF; --cat-perso-ink: #6B2DB0; --cat-perso-dot: #9B6CF6;
  --cat-travail: #ECFCFF; --cat-travail-ink: #0A7A8A; --cat-travail-dot: #1ABCD5;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--bg); color: var(--ink); font-family: -apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif; font-size: 15px; -webkit-font-smoothing: antialiased; overflow: hidden; }

/* ========= LAYOUT ========= */
#app { display: flex; flex-direction: column; height: 100%; }
#main { flex: 1; overflow: hidden; position: relative; }
.view { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; display: none; padding-bottom: calc(var(--tabbar) + var(--safe-bottom) + 16px); }
.view.active { display: block; }

/* ========= HEADER ========= */
#header {
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  padding: 12px 16px 0;
  position: relative;
  z-index: 10;
}
.header-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}
.header-title { font-size: 20px; font-weight: 700; letter-spacing: -0.3px; }
.header-actions { display: flex; gap: 8px; }
.hbtn {
  width: 36px; height: 36px; border-radius: 50%; border: none; cursor: pointer;
  background: var(--soft); color: var(--ink); display: flex; align-items: center; justify-content: center;
  font-size: 17px; transition: background .15s;
}
.hbtn:active { background: var(--line); }

/* Vue tabs */
.view-tabs {
  display: flex; gap: 4px; padding-bottom: 0;
}
.vtab {
  flex: 1; text-align: center; padding: 8px 4px 10px;
  font-size: 13px; font-weight: 500; color: var(--muted);
  border: none; background: none; cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: color .15s, border-color .15s;
}
.vtab.active { color: var(--accent); border-bottom-color: var(--accent); }

/* ========= WEEK STRIP (vue Liste) ========= */
.week-strip {
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  padding: 10px 16px 12px;
  display: flex;
  gap: 4px;
  overflow-x: auto;
  scrollbar-width: none;
}
.week-strip::-webkit-scrollbar { display: none; }
.wday {
  flex: 1; min-width: 42px; display: flex; flex-direction: column; align-items: center;
  gap: 4px; cursor: pointer;
}
.wday-label { font-size: 11px; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }
.wday-num {
  width: 34px; height: 34px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; font-weight: 500; transition: background .15s, color .15s;
}
.wday.active .wday-num { background: var(--accent); color: #fff; font-weight: 700; }
.wday.today .wday-num { font-weight: 700; color: var(--accent); }
.wday-dots { display: flex; gap: 3px; height: 6px; align-items: center; }
.wdot { width: 5px; height: 5px; border-radius: 50%; }

/* ========= LISTE VIEW ========= */
.day-group { margin: 0 16px 20px; }
.day-heading {
  font-size: 12px; font-weight: 600; color: var(--muted);
  text-transform: uppercase; letter-spacing: .6px;
  padding: 14px 0 8px;
}
.day-heading.today-label { color: var(--accent); }

.event-card {
  background: var(--surface); border-radius: var(--r-md);
  margin-bottom: 8px; display: flex; align-items: stretch;
  overflow: hidden; cursor: pointer;
  box-shadow: 0 1px 4px rgba(0,0,0,.06);
  transition: transform .12s, box-shadow .12s;
}
.event-card:active { transform: scale(.98); box-shadow: 0 1px 2px rgba(0,0,0,.04); }
.event-side { width: 4px; flex-shrink: 0; }
.event-time {
  width: 54px; flex-shrink: 0;
  display: flex; flex-direction: column; align-items: flex-end; justify-content: center;
  padding: 12px 10px 12px 12px;
  font-size: 12px; font-weight: 600; color: var(--muted); line-height: 1.3;
  border-right: 1px solid var(--line);
}
.event-time .end-time { font-weight: 400; opacity: .7; }
.event-body { flex: 1; padding: 12px 12px 12px 10px; display: flex; align-items: center; gap: 10px; }
.event-icon {
  width: 36px; height: 36px; border-radius: var(--r-sm); flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; font-size: 18px;
}
.event-info { flex: 1; min-width: 0; }
.event-title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.event-sub { font-size: 12px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.event-avatars { display: flex; }
.event-avatar {
  width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--surface);
  margin-left: -6px; font-size: 10px; font-weight: 700;
  display: flex; align-items: center; justify-content: center; color: #fff;
}
.event-avatar:first-child { margin-left: 0; }

/* allday */
.allday-chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 10px; border-radius: var(--r-pill);
  font-size: 12px; font-weight: 500; margin: 0 16px 6px; cursor: pointer;
  transition: opacity .15s;
}
.allday-chip:active { opacity: .7; }

/* ========= SEMAINE VIEW ========= */
#view-week { display: none; }
#view-week.active { display: flex; flex-direction: column; }
.week-nav {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--line);
}
.week-nav-title { font-size: 15px; font-weight: 600; }
.week-nav-btn { background: none; border: none; cursor: pointer; color: var(--accent); font-size: 20px; padding: 4px 8px; }
.week-grid-wrap { flex: 1; overflow: hidden; display: flex; flex-direction: column; padding-bottom: calc(var(--tabbar) + var(--safe-bottom) + 16px); }
.week-allday-row {
  display: flex; padding: 6px 8px 6px 48px; gap: 4px; overflow-x: auto;
  background: var(--surface); border-bottom: 1px solid var(--line); scrollbar-width: none;
}
.week-allday-row::-webkit-scrollbar { display: none; }
.week-allday-cell { flex: 1; min-width: 0; }
.week-allday-ev {
  font-size: 11px; font-weight: 500; padding: 2px 6px; border-radius: 4px;
  margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.week-scroll { flex: 1; overflow-y: auto; overflow-x: auto; }
.week-grid {
  display: flex; min-width: 0;
}
.week-time-col {
  width: 48px; flex-shrink: 0; position: sticky; left: 0; background: var(--bg); z-index: 2;
}
.week-time-label {
  height: 56px; display: flex; align-items: flex-start; justify-content: flex-end;
  padding: 0 8px; font-size: 11px; color: var(--muted); font-weight: 500;
}
.week-days-wrap { flex: 1; display: flex; overflow-x: auto; scrollbar-width: none; }
.week-days-wrap::-webkit-scrollbar { display: none; }
.week-day-col { flex: 1; min-width: 48px; position: relative; border-left: 1px solid var(--line); }
.week-day-header {
  position: sticky; top: 0; z-index: 1; background: var(--surface);
  padding: 6px 4px; text-align: center; border-bottom: 1px solid var(--line);
}
.week-day-header .wdh-label { font-size: 10px; font-weight: 500; color: var(--muted); text-transform: uppercase; }
.week-day-header .wdh-num { font-size: 16px; font-weight: 600; }
.week-day-header.today-col .wdh-num {
  background: var(--accent); color: #fff; border-radius: 50%;
  width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; margin: 0 auto;
}
.week-hour-row { height: 56px; border-bottom: 1px solid var(--line); position: relative; }
.week-event-block {
  position: absolute; left: 2px; right: 2px; border-radius: 6px;
  padding: 2px 4px; font-size: 10px; font-weight: 500; overflow: hidden;
  cursor: pointer; z-index: 1; line-height: 1.3;
}
.week-now-line {
  position: absolute; left: 0; right: 0; height: 2px; background: #FF3B30; z-index: 3;
}
.week-now-dot {
  position: absolute; left: -4px; top: -4px; width: 10px; height: 10px;
  border-radius: 50%; background: #FF3B30;
}

/* ========= MOIS VIEW ========= */
.month-nav {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px; background: var(--surface); border-bottom: 1px solid var(--line);
}
.month-nav-title { font-size: 16px; font-weight: 700; cursor: pointer; }
.month-nav-btn { background: none; border: none; cursor: pointer; color: var(--accent); font-size: 20px; padding: 4px 8px; }
.month-grid-wrap { background: var(--surface); }
.month-dow-row {
  display: grid; grid-template-columns: repeat(7, 1fr);
  padding: 6px 8px 4px; border-bottom: 1px solid var(--line);
}
.month-dow { text-align: center; font-size: 11px; font-weight: 500; color: var(--muted); text-transform: uppercase; }
.month-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; padding: 0 8px 8px; }
.month-cell {
  min-height: 52px; display: flex; flex-direction: column; align-items: center;
  padding: 4px 2px; cursor: pointer; border-radius: 8px; transition: background .12s;
}
.month-cell:active { background: var(--soft); }
.month-cell.other-month .mcell-num { color: var(--line); }
.mcell-num {
  width: 28px; height: 28px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 500;
}
.month-cell.today-cell .mcell-num { background: var(--accent); color: #fff; font-weight: 700; }
.month-cell.selected-cell .mcell-num { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.mcell-dots { display: flex; gap: 2px; margin-top: 2px; }
.mcell-dot { width: 4px; height: 4px; border-radius: 50%; }
.month-day-events { margin: 8px 16px; }
.month-day-title { font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 8px; }

/* ========= BOTTOM TAB BAR ========= */
#tabbar {
  height: calc(var(--tabbar) + var(--safe-bottom));
  padding-bottom: var(--safe-bottom);
  background: var(--surface);
  border-top: 1px solid var(--line);
  display: flex;
  position: relative;
  z-index: 20;
}
.tab {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px; cursor: pointer; color: var(--muted); border: none; background: none;
  font-size: 10px; font-weight: 500; transition: color .15s; padding-bottom: 2px;
}
.tab.active { color: var(--accent); }
.tab-icon { font-size: 22px; line-height: 1; }

/* ========= FAB ========= */
#fab {
  position: fixed; right: 20px;
  bottom: calc(var(--tabbar) + var(--safe-bottom) + 16px);
  width: 54px; height: 54px; border-radius: 50%;
  background: var(--accent); color: #fff;
  border: none; cursor: pointer; font-size: 26px;
  box-shadow: 0 4px 16px rgba(76,141,246,.4);
  display: flex; align-items: center; justify-content: center;
  z-index: 30; transition: transform .15s, box-shadow .15s;
}
#fab:active { transform: scale(.93); }
#fab-menu {
  position: fixed; right: 20px;
  bottom: calc(var(--tabbar) + var(--safe-bottom) + 80px);
  background: var(--surface); border-radius: var(--r-md);
  box-shadow: 0 8px 32px rgba(0,0,0,.14);
  overflow: hidden; z-index: 31; display: none; min-width: 180px;
}
#fab-menu.open { display: block; }
.fab-item {
  display: flex; align-items: center; gap: 12px; padding: 14px 18px;
  cursor: pointer; font-size: 14px; font-weight: 500; transition: background .12s;
  border-bottom: 1px solid var(--line);
}
.fab-item:last-child { border-bottom: none; }
.fab-item:active { background: var(--soft); }
.fab-item-icon { font-size: 20px; width: 28px; text-align: center; }

/* ========= BOTTOM SHEET ========= */
.sheet-backdrop {
  position: fixed; inset: 0; background: rgba(0,0,0,.35);
  z-index: 40; display: none; opacity: 0;
  transition: opacity .25s;
}
.sheet-backdrop.open { display: block; opacity: 1; }
.sheet {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: var(--surface); border-radius: 20px 20px 0 0;
  z-index: 41; transform: translateY(100%);
  transition: transform .3s cubic-bezier(.32,1,.23,1);
  max-height: 92vh; overflow-y: auto;
  padding-bottom: calc(16px + var(--safe-bottom));
}
.sheet.open { transform: translateY(0); }
.sheet-handle {
  width: 36px; height: 4px; background: var(--line); border-radius: 2px;
  margin: 10px auto 16px;
}
.sheet-title { font-size: 17px; font-weight: 700; padding: 0 20px 16px; }
.sheet-row { padding: 0 20px 14px; }
.sheet-label { font-size: 12px; font-weight: 500; color: var(--muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: .5px; }
.sheet-field {
  background: var(--soft); border-radius: var(--r-sm); border: none;
  padding: 12px 14px; font-size: 15px; width: 100%; color: var(--ink);
  font-family: inherit;
}
.sheet-field:focus { outline: 2px solid var(--accent); }

/* chips */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  padding: 7px 14px; border-radius: var(--r-pill); font-size: 13px; font-weight: 500;
  cursor: pointer; border: 2px solid transparent; transition: all .15s; display: flex; align-items: center; gap: 6px;
}
.chip.active { border-color: currentColor; }
.chip-add {
  padding: 7px 14px; border-radius: var(--r-pill); font-size: 13px; font-weight: 500;
  cursor: pointer; border: 2px dashed var(--line); color: var(--muted); background: none;
  display: flex; align-items: center; gap: 5px; transition: all .15s;
}
.chip-add:hover, .chip-add:active { border-color: var(--accent); color: var(--accent); }
/* mini-form new cat */
.newcat-form {
  display: none; width: 100%; margin-top: 10px;
  background: var(--soft); border-radius: var(--r-sm); padding: 12px;
  flex-direction: column; gap: 10px;
}
.newcat-form.open { display: flex; }
.newcat-row { display: flex; gap: 8px; align-items: center; }
.newcat-input {
  flex: 1; background: var(--surface); border: 1.5px solid var(--line); border-radius: 8px;
  padding: 9px 12px; font-size: 14px; color: var(--ink); font-family: inherit;
}
.newcat-input:focus { outline: none; border-color: var(--accent); }
.newcat-colors { display: flex; gap: 6px; flex-wrap: wrap; }
.newcat-color {
  width: 26px; height: 26px; border-radius: 50%; border: 2px solid transparent; cursor: pointer;
  transition: transform .12s, border-color .12s;
}
.newcat-color.sel { border-color: var(--ink); transform: scale(1.15); }
.newcat-actions { display: flex; gap: 8px; }
.newcat-btn {
  flex: 1; padding: 9px; border-radius: 8px; border: none; cursor: pointer;
  font-size: 13px; font-weight: 600; transition: opacity .15s;
}
.newcat-btn:active { opacity: .8; }
.newcat-btn.ok { background: var(--accent); color: #fff; }
.newcat-btn.cancel { background: var(--line); color: var(--muted); }

/* participants */
.participants { display: flex; gap: 10px; }
.part-btn {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  cursor: pointer; opacity: .45; transition: opacity .15s;
}
.part-btn.active { opacity: 1; }
.part-av {
  width: 44px; height: 44px; border-radius: 50%; font-size: 18px; font-weight: 700;
  display: flex; align-items: center; justify-content: center; color: #fff;
}
.part-name { font-size: 11px; font-weight: 500; color: var(--muted); }
.part-btn.active .part-name { color: var(--ink); }

/* time row */
.time-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.time-btn {
  background: var(--soft); border: none; border-radius: var(--r-sm);
  padding: 12px; display: flex; flex-direction: column; gap: 2px; cursor: pointer;
}
.time-btn-label { font-size: 11px; color: var(--muted); font-weight: 500; }
.time-btn-val { font-size: 15px; font-weight: 600; color: var(--ink); }

/* reminders */
.reminder-list { display: flex; flex-direction: column; gap: 8px; }
.rem-row {
  display: flex; align-items: center; justify-content: space-between;
  background: var(--soft); border-radius: var(--r-sm); padding: 12px 14px;
}
.rem-left { display: flex; align-items: center; gap: 10px; }
.rem-icon { font-size: 20px; }
.rem-text { font-size: 14px; font-weight: 500; }
.rem-sub { font-size: 12px; color: var(--muted); margin-top: 1px; }
.rem-toggle {
  width: 44px; height: 26px; border-radius: var(--r-pill); border: none; cursor: pointer;
  background: var(--line); position: relative; transition: background .2s; flex-shrink: 0;
}
.rem-toggle::after {
  content: ''; position: absolute; top: 3px; left: 3px;
  width: 20px; height: 20px; border-radius: 50%; background: #fff;
  transition: transform .2s; box-shadow: 0 1px 3px rgba(0,0,0,.2);
}
.rem-toggle.on { background: var(--accent); }
.rem-toggle.on::after { transform: translateX(18px); }

/* button */
.btn-primary {
  display: block; width: calc(100% - 40px); margin: 8px 20px 0;
  background: var(--accent); color: #fff; border: none; border-radius: var(--r-md);
  padding: 15px; font-size: 16px; font-weight: 600; cursor: pointer;
  transition: opacity .15s;
}
.btn-primary:active { opacity: .85; }

/* ========= DETAIL SHEET ========= */
.detail-header {
  padding: 0 20px 16px;
  display: flex; align-items: flex-start; gap: 14px;
}
.detail-icon { width: 50px; height: 50px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 24px; flex-shrink: 0; }
.detail-info { flex: 1; }
.detail-title { font-size: 19px; font-weight: 700; line-height: 1.2; }
.detail-cat { font-size: 13px; font-weight: 500; margin-top: 4px; }
.detail-row { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-top: 1px solid var(--line); }
.detail-row-icon { font-size: 20px; width: 28px; text-align: center; color: var(--muted); }
.detail-row-text { font-size: 14px; }
.detail-row-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
.demo-badge {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 4px 10px; border-radius: var(--r-pill); font-size: 11px; font-weight: 500;
  background: var(--soft); color: var(--muted); margin: 0 20px 10px;
  border: 1px solid var(--line);
}
.detail-actions { display: flex; gap: 10px; padding: 10px 20px 0; }
.det-btn {
  flex: 1; padding: 12px; border-radius: var(--r-md); border: none; cursor: pointer;
  font-size: 14px; font-weight: 600; transition: opacity .15s;
}
.det-btn:active { opacity: .8; }
.det-btn.edit { background: var(--soft); color: var(--ink); }
.det-btn.del { background: #FFF0F0; color: #C42929; }

/* ========= SEARCH OVERLAY ========= */
#search-overlay {
  position: fixed; inset: 0; background: var(--bg); z-index: 50; display: none; flex-direction: column;
}
#search-overlay.open { display: flex; }
.search-bar { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
.search-input {
  flex: 1; background: var(--soft); border: none; border-radius: var(--r-pill);
  padding: 10px 16px; font-size: 15px; color: var(--ink); font-family: inherit;
}
.search-input:focus { outline: 2px solid var(--accent); }
.search-cancel { background: none; border: none; color: var(--accent); font-size: 15px; cursor: pointer; white-space: nowrap; font-weight: 500; }
.search-results { flex: 1; overflow-y: auto; padding: 16px; }
.search-hint { text-align: center; color: var(--muted); font-size: 14px; margin-top: 60px; }

/* ========= ÉDITEUR PLEIN ÉCRAN ========= */
.editor {
  position: fixed; inset: 0; background: var(--bg);
  z-index: 60; transform: translateY(100%);
  transition: transform .3s cubic-bezier(.32,1,.23,1);
  display: flex; flex-direction: column; overflow: hidden;
}
.editor.open { transform: translateY(0); }
.editor-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 16px; background: var(--surface);
  border-bottom: 1px solid var(--line); flex-shrink: 0;
}
.editor-close { border: none; background: none; cursor: pointer; font-size: 22px; color: var(--muted); padding: 4px; }
.editor-save { border: none; background: none; cursor: pointer; font-size: 20px; color: var(--accent); font-weight: 700; padding: 4px; }
.editor-title-label { font-size: 17px; font-weight: 700; }
.editor-types {
  display: flex; background: var(--soft); border-radius: var(--r-pill);
  padding: 3px; margin: 10px 16px 0; flex-shrink: 0; white-space: nowrap;
}
.etype {
  flex: 1; padding: 7px 2px; border: none; background: none; cursor: pointer;
  font-size: 12px; font-weight: 500; color: var(--muted);
  border-radius: var(--r-pill); transition: all .15s; white-space: nowrap; min-width: 0;
}
.etype.active { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
.editor-body { flex: 1; overflow-y: auto; padding-bottom: calc(32px + var(--safe-bottom)); }
/* title input */
.editor-title-input {
  display: block; width: 100%; border: none; background: var(--surface);

  margin-bottom: 16px;
}
.editor-title-input:focus { outline: none; border-bottom-color: var(--accent); }
.editor-title-input::placeholder { color: var(--muted); font-weight: 400; opacity: .6; }
/* sections */
.esec { margin: 0 0 16px; }
.esec-title { font-size: 11px; font-weight: 600; color: var(--accent); text-transform: uppercase; letter-spacing: .7px; padding: 0 20px 6px; }
.esec-card { background: var(--surface); border-radius: var(--r-md); margin: 0 16px; overflow: hidden; }
.erow {
  display: flex; align-items: center; padding: 13px 16px;
  border-bottom: 1px solid var(--line); gap: 12px; cursor: pointer; transition: background .12s;
}
.erow:last-child { border-bottom: none; }
.erow:active { background: var(--soft); }
.erow-icon { font-size: 19px; width: 28px; text-align: center; flex-shrink: 0; }
.erow-label { font-size: 14px; font-weight: 500; color: var(--ink); flex: 1; }
.erow-value { font-size: 14px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.erow-value .arrow { font-size: 13px; color: var(--line); }
.erow-input {
  flex: 1; border: none; background: none; font-size: 14px; color: var(--ink);
  font-family: inherit; text-align: right; min-width: 0; cursor: text;
}
.erow-input:focus { outline: none; }
.erow-input::placeholder { color: var(--muted); }
.erow-textarea {
  flex: 1; border: none; background: none; font-size: 14px; color: var(--ink);
  font-family: inherit; resize: none; min-height: 80px; padding: 0; cursor: text;
}
.erow-textarea:focus { outline: none; }
.erow-textarea::placeholder { color: var(--muted); }
/* date/time buttons */
.erow-datetime { display: flex; gap: 6px; flex-shrink: 0; }
.erow-date-btn, .erow-time-btn {
  background: var(--soft); border: none; border-radius: 8px;
  padding: 5px 10px; font-size: 13px; font-weight: 500; color: var(--ink); cursor: pointer;
}
.erow-time-btn.muted { color: var(--muted); }
/* reminders in editor */
.erem-row {
  display: flex; align-items: center; padding: 12px 16px;
  border-bottom: 1px solid var(--line); gap: 10px;
}
.erem-del {
  width: 22px; height: 22px; border-radius: 50%; background: #F65C5C; border: none;
  color: #fff; font-size: 15px; cursor: pointer; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
}
.erem-label { flex: 1; font-size: 14px; }
.erem-add {
  display: flex; align-items: center; gap: 10px; padding: 12px 16px; cursor: pointer; transition: background .12s;
}
.erem-add:active { background: var(--soft); }
.erem-add-icon {
  width: 22px; height: 22px; border-radius: 50%; background: #34C768; border: none;
  color: #fff; font-size: 17px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.erem-add-label { font-size: 14px; }
.erem-picker { display: none; padding: 10px 16px; flex-wrap: wrap; gap: 8px; border-top: 1px solid var(--line); }
.erem-picker.open { display: flex; }
.erem-opt {
  padding: 6px 12px; border-radius: var(--r-pill); background: var(--soft);
  font-size: 13px; font-weight: 500; cursor: pointer; transition: all .12s;
}
.erem-opt:active { background: var(--accent-soft); color: var(--accent); }
/* participants */
.eparts { display: flex; gap: 10px; flex-wrap: wrap; padding: 12px 16px; }
.epart-btn { display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; opacity: .4; transition: opacity .15s; }
.epart-btn.active { opacity: 1; }
.epart-av { width: 40px; height: 40px; border-radius: 50%; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; color: #fff; }
.epart-name { font-size: 10px; font-weight: 500; color: var(--muted); }
.epart-btn.active .epart-name { color: var(--ink); }
/* icon picker */
.eicon-grid { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 16px; border-top: 1px solid var(--line); }
.eicon-btn { width: 42px; height: 42px; font-size: 22px; border-radius: 10px; border: 2px solid transparent; background: var(--soft); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all .12s; }
.eicon-btn.sel { border-color: var(--accent); background: var(--accent-soft); }
/* color picker */
.ecolor-row { display: flex; gap: 8px; padding: 10px 16px; flex-wrap: wrap; border-top: 1px solid var(--line); }
.ecolor-btn { width: 30px; height: 30px; border-radius: 50%; border: 3px solid transparent; cursor: pointer; transition: transform .12s, border-color .12s; }
.ecolor-btn.sel { border-color: var(--ink); transform: scale(1.15); }
/* category manager */
.catmgr { display: flex; flex-direction: column; }
.catmgr-header { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.catmgr-back { background: none; border: none; color: var(--accent); font-size: 14px; font-weight: 600; cursor: pointer; padding: 0; }
.catmgr-title { font-size: 14px; font-weight: 600; color: var(--ink); }
.catmgr-row { display: flex; align-items: center; gap: 10px; padding: 11px 16px; border-bottom: 1px solid var(--line); }
.catmgr-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.catmgr-row-icon { font-size: 18px; line-height: 1; }
.catmgr-row-name { flex: 1; font-size: 14px; }
.catmgr-row-edit, .catmgr-row-del { background: none; border: none; font-size: 15px; cursor: pointer; padding: 4px 6px; border-radius: 6px; opacity: .65; transition: all .12s; }
.catmgr-row-edit:hover, .catmgr-row-del:hover { opacity: 1; background: var(--soft); }
.catmgr-edit-wrap { padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--soft); }
.catmgr-edit-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.catmgr-edit-icon { font-size: 22px; cursor: default; padding: 6px 8px; border-radius: 8px; background: var(--bg); border: 1px solid var(--line); line-height: 1; }
.catmgr-edit-name { flex: 1; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 14px; color: var(--ink); font-family: inherit; }
.catmgr-edit-name:focus { outline: none; border-color: var(--accent); }
.catmgr-icon-grid { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 10px; }
.catmgr-icon-btn { font-size: 20px; padding: 4px 6px; border-radius: 6px; cursor: pointer; border: 2px solid transparent; background: var(--bg); transition: all .12s; line-height: 1; }
.catmgr-icon-btn.sel { border-color: var(--accent); background: var(--accent-soft); }
.catmgr-edit-actions { display: flex; gap: 8px; margin-top: 10px; }
.catmgr-btn { flex: 1; padding: 8px 14px; border-radius: 8px; border: none; font-size: 13px; font-weight: 600; cursor: pointer; }
.catmgr-btn.ok { background: var(--accent); color: #fff; }
.catmgr-btn.cancel { background: var(--line); color: var(--muted); }
.catmgr-btn.danger { background: #F65C5C; color: #fff; }
.catmgr-del-wrap { padding: 12px 16px; border-bottom: 1px solid var(--line); background: #FFF0F0; }
.catmgr-del-title { font-size: 13px; font-weight: 600; color: #C42929; margin-bottom: 8px; }
.catmgr-del-reassign { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; font-size: 13px; flex-wrap: wrap; }
.catmgr-del-reassign select { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; font-size: 13px; color: var(--ink); font-family: inherit; }
.catmgr-new { padding: 12px 16px; }
/* task state */
.estate-row { display: flex; gap: 8px; padding: 12px 16px; }
.estate-btn { flex: 1; padding: 10px; border-radius: 10px; border: 2px solid var(--line); background: none; font-size: 13px; font-weight: 500; cursor: pointer; color: var(--muted); transition: all .15s; }
.estate-btn.active { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 600; }
/* save btn */
.editor-save-btn {
  display: block; margin: 16px 20px 8px; background: var(--accent); color: #fff;
  border: none; border-radius: var(--r-md); padding: 15px; font-size: 16px;
  font-weight: 600; cursor: pointer; width: calc(100% - 40px); transition: opacity .15s;
}
.editor-save-btn:active { opacity: .85; }

/* date/time inputs in editor */
.erow-date-in, .erow-time-in {
  background: var(--soft); border: none; border-radius: 8px;
  padding: 5px 10px; font-size: 13px; font-weight: 500; color: var(--ink);
  font-family: inherit; -webkit-appearance: none;
}
.erow-date-in:focus, .erow-time-in:focus { outline: 2px solid var(--accent); }
.erow-time-in.muted { color: var(--muted); }
/* task done state */
.ev-done .event-title { text-decoration: line-through; opacity: .55; }
.ev-done { opacity: .75; }
/* prototype notice */
.proto-notice {
  background: #FFF8E8; color: #A05C00; border: 1px solid #F6A82C33;
  border-radius: 8px; padding: 8px 12px; margin: 8px 16px 0;
  font-size: 12px; line-height: 1.5; display: flex; gap: 8px; align-items: flex-start;
}
.proto-notice-icon { flex-shrink: 0; }
/* Avertissement >5 rappels */
.rem-warn { background:#FFF3CD; border:1px solid #FFCA2880; border-radius:10px; padding:10px 14px; font-size:13px; color:#7A5500; display:flex; gap:8px; align-items:flex-start; margin:4px 0 6px; line-height:1.5; }
/* Règle non supportée */
.rrule-unsupported { background:#FFF0F0; border:1px solid #FFCCCC; border-radius:8px; padding:8px 12px; margin:4px 16px; font-size:12px; color:#993333; }
/* EXDATE / dates exclues */
.exdate-section { padding:8px 16px 0; }
.exdate-chip { display:inline-flex; align-items:center; gap:5px; background:var(--soft); border:1px solid var(--line); border-radius:var(--r-pill); padding:3px 10px; font-size:12px; color:var(--muted); margin:3px 3px 0 0; }
.exdate-chip-del { background:none; border:none; cursor:pointer; color:var(--muted); font-size:14px; padding:0 0 0 2px; line-height:1; }
.exdate-chip-del:hover { color:#F65C5C; }
/* Mac: center editor content */
@media (min-width: 600px) {
  .editor-types { max-width: 580px; margin-left: auto; margin-right: auto; }
  .etype { font-size: 13px; padding: 7px 4px; }
  .editor-title-input { max-width: 720px; margin-left: auto; margin-right: auto; display: block; }
  .esec { max-width: 720px; margin-left: auto; margin-right: auto; }
  .rrule-freq-row, .rrule-interval-row, .rrule-days-row, .rrule-end-row, .rrule-preview, .rrule-desc { max-width: 720px; }
}
@media (min-width: 900px) {
  .editor-title-input { max-width: 820px; }
  .esec { max-width: 820px; }
  .editor-types { max-width: 640px; }
}
/* Week view — mobile: FAB doesn't overlap nav */
@media (max-width: 599px) {
  #view-week .week-nav { padding-right: 80px; }
}
/* ========= RRULE EDITOR ========= */
.rrule-freq-row { display:flex; padding:10px 16px; gap:6px; flex-wrap:wrap; border-bottom:1px solid var(--line); }
.rrule-freq-pill { padding:6px 14px; border-radius:var(--r-pill); font-size:13px; font-weight:500; cursor:pointer; border:2px solid var(--line); background:none; color:var(--muted); transition:all .15s; }

.rrule-day-btn.sel { background:var(--accent); border-color:var(--accent); color:#fff; }
.rrule-end-row { display:flex; padding:10px 16px; gap:8px; flex-wrap:wrap; border-bottom:1px solid var(--line); }
.rrule-end-pill { padding:6px 12px; border-radius:var(--r-pill); font-size:13px; font-weight:500; cursor:pointer; border:2px solid var(--line); background:none; color:var(--muted); transition:all .15s; }
.rrule-end-pill.sel { background:var(--accent-soft); border-color:var(--accent); color:var(--accent); font-weight:600; }

/* ========= CONTACT PICKER ========= */

<script>
"use strict";

// ---- TOAST ----
function toast(msg, dur) {
  dur = dur || 2500;
  let el = document.getElementById('ag-toast');
  if (!el) {
    el = document.createElement('div'); el.id = 'ag-toast';
    el.style.cssText = 'position:fixed;bottom:calc(var(--tabbar) + var(--safe-bottom) + 20px);left:50%;transform:translateX(-50%) translateY(20px);background:#1A1D2E;color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;font-weight:500;z-index:100;opacity:0;transition:opacity .2s,transform .2s;white-space:nowrap;pointer-events:none;max-width:90vw;text-align:center';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.opacity = '1'; el.style.transform = 'translateX(-50%) translateY(0)';
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.style.opacity='0'; el.style.transform='translateX(-50%) translateY(10px)'; }, dur);
}

// ---- MEMBRES ----
const MEMBERS = [
  { id: 'f', name: 'Franck', color: '#4C8DF6', initials: 'F' },
  { id: 'm', name: 'Marie',  color: '#F65C9B', initials: 'M' },
  { id: 'l', name: 'Léa',   color: '#34C768', initials: 'L' },

const NOW = new Date(2026, 10, 16, 9, 23);
function isoDate(y, m, d) { return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`; }
function today() { return '2026-11-16'; }
function addDays(iso, n) { const d = new Date(iso+'T12:00:00'); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function fmtDateShort(iso) { return new Date(iso+'T12:00').toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'}); }
function fmtRemLabel(r) {
  if (!r) return '';
  if (typeof r === 'string') return r;
  if (r.type === 'preset') return r.label;
  if (r.type === 'custom') {
    const m = r.min;
    if (m >= 1440 && m % 1440 === 0) return (m/1440) + ' jour' + (m/1440>1?'s':'') + ' avant';
    if (m >= 1440) { const d=Math.floor(m/1440),h=Math.floor((m%1440)/60); return d + 'j ' + (h>0?h+'h ':'')+((m%60)>0?(m%60)+'min ':'')+'avant'; }
    if (m >= 60 && m % 60 === 0) return (m/60) + ' h avant';
    if (m >= 60) return Math.floor(m/60) + ' h ' + (m%60) + ' min avant';
    return m + ' min avant';
  }
  if (r.type === 'exact') return 'Le ' + fmtDateShort(r.date) + ' à ' + r.time;
  return String(r);
}

const DB_KEY = 'agv2_proto';
let EVENTS = DEMO_EVENTS.map(e => ({...e}));
let _nextId = 100;

function dbLoad() {
  try {
    const s = localStorage.getItem(DB_KEY);
    if (!s) return;
    const d = JSON.parse(s);
    if (Array.isArray(d.events)) EVENTS = d.events;
    if (d.nextId) _nextId = d.nextId;
    if (Array.isArray(d.cats)) {
      const BUILTIN_IDS = ['rva','sante','sport','famille','perso','travail'];
      const hasAllBuiltins = BUILTIN_IDS.every(id => d.cats.find(c=>c.id===id));
      if (hasAllBuiltins) {
        CATS.length = 0;
        d.cats.forEach(c => CATS.push(c));
      } else {
        d.cats.forEach(c => { if (!CATS.find(x=>x.id===c.id)) CATS.push(c); });
      }
    }
  } catch(e) {}
}
function dbSave() {
  try { localStorage.setItem(DB_KEY, JSON.stringify({ events: EVENTS, nextId: _nextId, cats: CATS })); } catch(e) {}
}
function dbReset() {
  if (!confirm('Réinitialiser les données fictives ? Les événements créés seront effacés.')) return;
  localStorage.removeItem(DB_KEY); location.reload();
}
function newId() { return 'u' + (_nextId++); }

// ---- HELPERS ----
function getcat(id) { return CATS.find(c=>c.id===id) || CATS[0]; }
function getmember(id) { return MEMBERS.find(m=>m.id===id); }
function formatDate(iso) {
  const d = new Date(iso+'T12:00:00');
  return d.toLocaleDateString('fr-FR', { weekday:'long', day:'numeric', month:'long' });
}
function shortDay(iso) {
  const d = new Date(iso+'T12:00:00');
  return ['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'][d.getDay()];
}
function eventsOnDay(iso) { return EVENTS.filter(e=>e.date===iso); }
function renderCurrentView() {
  if (currentView==='list') renderList();

  else renderMonth();
}

// ---- RENDER LIST VIEW ----
function renderList() {
  renderWeekStrip();
  const container = document.getElementById('list-events');
  const days = [];
  for (let i=-2; i<=7; i++) days.push(addDays(today(), i));
  let html = '';
  for (const d of days) {
    const evs = eventsOnDay(d);
    const alldays = evs.filter(e=>e.allday);
    const timed = evs.filter(e=>!e.allday);
    if (!evs.length) continue;
    const isToday = d===today();
    const dateStr = isToday ? 'Aujourd\'hui' : formatDate(d).replace(/^./, c=>c.toUpperCase());
    html += `<div class="day-group" data-date="${d}">
      <div class="day-heading ${isToday?'today-label':''}">${dateStr}</div>`;
    for (const e of alldays) {
      const cat = getcat(e.cat);
      html += `<div class="allday-chip" style="background:${cat.bg};color:${cat.ink}" onclick="openDetail('${e.id}')">
        ${cat.icon} <strong>${e.title}</strong>
      </div>`;
    }
    for (const e of timed) {
      html += renderEventCard(e);
    }
    html += '</div>';
  }
  container.innerHTML = html;
  // scroll to today
  setTimeout(()=>{
    const el = container.querySelector(`[data-date="${today()}"]`);
    if (el) el.scrollIntoView({ behavior:'smooth', block:'start' });
  }, 50);
}

function fmtCountdownShort(isoDate, startTime) {
  try {
    const target = new Date((isoDate||today())+'T'+(startTime||'00:00')+':00');
    const diffMs = target - NOW;
    if (diffMs <= 0) return null;
    const diffMn = Math.floor(diffMs/60000);
    if (diffMn < 60) return diffMn+'min';
    const diffH = Math.floor(diffMn/60);
    if (diffH < 24) return diffH+'h';
    return Math.floor(diffH/24)+'j';
  } catch { return null; }
}

function renderEventCard(e) {
  const cat = getcat(e.cat);
  const mems = (e.members||[]).map(id=>getmember(id)).filter(Boolean);
  const avatars = mems.map(m=>`<div class="event-avatar" style="background:${m.color}">${m.initials}</div>`).join('');
  const done = e.state === 'done';
  let subExtra = '';
  if (e.countdown && !done) {
    const cd = fmtCountdownShort(e.date, e.start);
    if (cd) subExtra = ` · ⏱ ${cd}`;
  }
  if (e.travel && e.travel !== 'Aucun') subExtra += ` · 🚗 ${e.travel}`;
  return `<div class="event-card${done?' ev-done':''}" onclick="openDetail('${e.id}')">
    <div class="event-side" style="background:${cat.dot}"></div>
    <div class="event-time"><span>${e.start||''}</span>${e.end?`<span class="end-time">${e.end}</span>`:''}</div>
    <div class="event-body">
      <div class="event-icon" style="background:${cat.bg}">${e.icon||cat.icon}</div>
      <div class="event-info">
        <div class="event-title">${e.title}</div>
        <div class="event-sub">${cat.label}${mems.length>1?' · '+mems.map(m=>m.name).join(', '):''}${subExtra}</div>
      </div>
      <div class="event-avatars">${avatars}</div>
    </div>
  </div>`;
}

// ---- RENDER WEEK VIEW ----
function weekNavPrev() {
  const isMobile = window.innerWidth < 600;
  if (isMobile) {
    mobileDayStart -= 3;
    if (mobileDayStart < 0) { mobileDayStart += 7; weekOffset--; }
  } else { weekOffset--; }
  renderWeek();
}
function weekNavNext() {
  const isMobile = window.innerWidth < 600;
  if (isMobile) {
    mobileDayStart += 3;
    if (mobileDayStart >= 7) { mobileDayStart -= 7; weekOffset++; }
  } else { weekOffset++; }
  renderWeek();
}

function renderWeek() {
  const wrap = document.getElementById('week-grid-wrap');
  const isMobile = window.innerWidth < 600;
  const daysToShow = isMobile ? 3 : 7;

  // compute Monday of current week
  const base = new Date(today()+'T12:00:00');
  const dow = (base.getDay()+6)%7;
  const weekMon = new Date(base);
  weekMon.setDate(base.getDate() - dow + weekOffset*7);

  // compute actual start date
  const startOffset = isMobile ? mobileDayStart : 0;
  const days = Array.from({length:daysToShow}, (_,i)=>{
    const d = new Date(weekMon); d.setDate(weekMon.getDate()+startOffset+i);
    return d.toISOString().slice(0,10);
  });

  // update title
  const titleEl = document.getElementById('week-title');
  const a = new Date(days[0]+'T12:00:00');
  const b = new Date(days[daysToShow-1]+'T12:00:00');
  if (isMobile) {
    if (a.getMonth()===b.getMonth())
      titleEl.textContent = `${a.getDate()}–${b.getDate()} ${a.toLocaleDateString('fr-FR',{month:'short',year:'numeric'})}`;
    else
      titleEl.textContent = `${a.getDate()} ${a.toLocaleDateString('fr-FR',{month:'short'})} – ${b.getDate()} ${b.toLocaleDateString('fr-FR',{month:'short',year:'numeric'})}`;
  } else {
    if (a.getMonth()===b.getMonth())
      titleEl.textContent = a.toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'}).replace(/^\d+/,`${a.getDate()}–${b.getDate()}`);
    else
      titleEl.textContent = `${a.getDate()} ${a.toLocaleDateString('fr-FR',{month:'short'})} – ${b.getDate()} ${b.toLocaleDateString('fr-FR',{month:'short',year:'numeric'})}`;
  }

  // update nav button handlers
  document.querySelector('#view-week .week-nav-btn:first-child').onclick = weekNavPrev;
  document.querySelector('#view-week .week-nav-btn:last-child').onclick = weekNavNext;

  const hours = Array.from({length:16}, (_,i)=>i+7); // 07–22
  const SLOT_H = 56;

  // header row
  let hcols = `<div style="width:48px;flex-shrink:0"></div>`;
  for (const d of days) {
    const isToday = d===today();
    const num = new Date(d+'T12:00:00').getDate();
    const label = shortDay(d);
    hcols += `<div class="week-day-header${isToday?' today-col':''}" style="flex:1;min-width:${isMobile?'80px':'48px'}">
      <div class="wdh-label">${label}</div>
      <div class="wdh-num">${num}</div>
    </div>`;
  }

  // allday row
  let alldayRow = `<div style="display:flex;background:var(--surface);border-bottom:1px solid var(--line);scrollbar-width:none">
    <div style="width:48px;flex-shrink:0"></div>`;
  for (const d of days) {
    const ads = eventsOnDay(d).filter(e=>e.allday);
    alldayRow += `<div style="flex:1;min-width:${isMobile?'80px':'48px'};padding:3px 2px">`;
    for (const e of ads) {
      const cat = getcat(e.cat);
      alldayRow += `<div style="font-size:10px;font-weight:500;padding:2px 4px;border-radius:3px;background:${cat.bg};color:${cat.ink};margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer" onclick="openDetail('${e.id}')">${e.title}</div>`;
    }
    alldayRow += '</div>';
  }
  alldayRow += '</div>';

  // timed event grid columns
  let gridCols = '';
  for (const d of days) {
    const timed = eventsOnDay(d).filter(e=>!e.allday && e.start);
    let evBlocks = '';
    for (const e of timed) {
      const [sh,sm] = (e.start||'00:00').split(':').map(Number);
      const [eh,em] = (e.end||'01:00').split(':').map(Number);
      const top = Math.max(0, (sh-7)*SLOT_H + sm/60*SLOT_H);
      const height = Math.max(24, ((eh-sh)*60+(em-sm))/60*SLOT_H);
      const cat = getcat(e.cat);
      const timeLabel = `${e.start}${e.end?' – '+e.end:''}`;
      evBlocks += `<div class="week-event-block" style="top:${top}px;height:${height}px;background:${cat.bg};color:${cat.ink}" onclick="openDetail('${e.id}')"><div style="font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${e.title}</div>${height>36?`<div style="font-size:9px;opacity:.8;white-space:nowrap;overflow:hidden">${timeLabel}</div>`:''}</div>`;
    }
    const isToday = d===today();
    const nowLine = isToday ? (() => {
      const h = NOW.getHours(), mn = NOW.getMinutes();
      if (h<7||h>22) return '';
      const top = (h-7)*SLOT_H + mn/60*SLOT_H;
      return `<div class="week-now-line" style="top:${top}px"><div class="week-now-dot"></div></div>`;
    })() : '';
    gridCols += `<div class="week-day-col" style="flex:1;min-width:${isMobile?'80px':'48px'}">${evBlocks}${nowLine}`;
    for (let r=0; r<hours.length; r++) gridCols += `<div class="week-hour-row"></div>`;
    gridCols += '</div>';
  }

  let timecol = '<div class="week-time-col">';
  for (const h of hours) timecol += `<div class="week-time-label">${String(h).padStart(2,'0')}h</div>`;
  timecol += '</div>';

  wrap.innerHTML = `
    <div style="display:flex;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2">${hcols}</div>
    ${alldayRow}
    <div class="week-scroll" id="week-scroll-area">
      <div class="week-grid">${timecol}<div style="flex:1;display:flex">${gridCols}</div></div>
    </div>`;

  // scroll to current time (or 07h if before)
  const scrollArea = document.getElementById('week-scroll-area');
  if (scrollArea) {
    const h = NOW.getHours(), mn = NOW.getMinutes();
    const scrollTo = h >= 7 ? Math.max(0, (h-7)*SLOT_H + mn/60*SLOT_H - 100) : 0;
    scrollArea.scrollTop = scrollTo;
  }

  // swipe gestures for mobile
  if (isMobile) {
    let touchStartX = 0;
    wrap.ontouchstart = e => { touchStartX = e.touches[0].clientX; };
    wrap.ontouchend = e => {
      const dx = e.changedTouches[0].clientX - touchStartX;
      if (Math.abs(dx) > 50) { if (dx < 0) weekNavNext(); else weekNavPrev(); }
    };
  } else {
    wrap.ontouchstart = null; wrap.ontouchend = null;
  }
}

// ---- RENDER MONTH VIEW ----
function renderMonth() {
  const base = new Date(2026, 10 + monthOffset, 1);
  const y = base.getFullYear(), m = base.getMonth();
  document.getElementById('month-title').textContent = base.toLocaleDateString('fr-FR',{month:'long',year:'numeric'}).replace(/^./,c=>c.toUpperCase());
  const firstDow = (new Date(y,m,1).getDay()+6)%7;
  const daysInMonth = new Date(y,m+1,0).getDate();
  const wrap = document.getElementById('month-grid-wrap');
  const DOW = ['L','M','M','J','V','S','D'];
  let html = `<div class="month-grid-wrap">
    <div class="month-dow-row">${DOW.map(d=>`<div class="month-dow">${d}</div>`).join('')}</div>
    <div class="month-grid">`;
  // prev month fill
  const prevDays = new Date(y,m,0).getDate();
  for (let i=firstDow-1; i>=0; i--) {
    const d = isoDate(m===0?y-1:y, m===0?11:m-1, prevDays-i);
    html += `<div class="month-cell other-month"><div class="mcell-num">${prevDays-i}</div></div>`;
  }
  // current month
  for (let day=1; day<=daysInMonth; day++) {
    const iso = isoDate(y,m,day);
    const evs = eventsOnDay(iso);
    const isToday = iso===today();
    const isSel = iso===selectedDay;
    const dots = evs.slice(0,3).map(e=>`<div class="mcell-dot" style="background:${getcat(e.cat).dot}"></div>`).join('');
    html += `<div class="month-cell${isToday?' today-cell':''}${isSel?' selected-cell':''}" onclick="selectMonthDay('${iso}')">
      <div class="mcell-num">${day}</div>
      <div class="mcell-dots">${dots}</div>
    </div>`;
  }
  // next fill
  const total = firstDow + daysInMonth;
  const nextFill = (7 - total%7)%7;
  for (let i=1; i<=nextFill; i++) {
    html += `<div class="month-cell other-month"><div class="mcell-num">${i}</div></div>`;
  }
  html += '</div></div>';
  wrap.innerHTML = html;
  renderMonthDayEvents();
}

function selectMonthDay(iso) {
  selectedDay = iso;
  renderMonth();
}

function renderMonthDayEvents() {
  const el = document.getElementById('month-day-events');
  const evs = eventsOnDay(selectedDay);
  if (!evs.length) { el.innerHTML = `<p style="color:var(--muted);font-size:14px;text-align:center;padding:16px 0">Aucun événement</p>`; return; }
  el.innerHTML = `<div class="month-day-title">${formatDate(selectedDay).replace(/^./,c=>c.toUpperCase())}</div>` + evs.map(e=>renderEventCard(e)).join('');
}

// ---- VIEW SWITCHING ----
function switchView(v, btn) {
  currentView = v;
  document.querySelectorAll('.view').forEach(el=>el.classList.remove('active'));
  document.querySelectorAll('.vtab').forEach(el=>el.classList.remove('active'));
  document.getElementById('view-'+v).classList.add('active');
  if (btn) btn.classList.add('active');
  if (v==='list') renderList();
  else if (v==='week') {
    // init mobileDayStart to show today's column
    if (window.innerWidth < 600) {
      const base = new Date(today()+'T12:00:00');
      mobileDayStart = (base.getDay()+6)%7; // 0=Mon
      // snap to 3-day block: 0→0, 1→0, 2→0, 3→3, 4→3, 5→3, 6→6
      mobileDayStart = Math.floor(mobileDayStart/3)*3;
    }
    renderWeek();
  }
  else if (v==='month') renderMonth();
}

function switchTab(t) {
  document.querySelectorAll('.tab').forEach(el=>el.classList.remove('active'));
  event.currentTarget.classList.add('active');
  if (t!=='agenda') {
    document.getElementById('app').style.opacity = '.95';
    setTimeout(()=>document.getElementById('app').style.opacity='1', 200);
  }
}

function goToday() { selectedDay = today(); weekOffset=0; monthOffset=0; renderCurrentView(); }

function suggestCatIcon(name) {
  if (!name) return '🏷️';
  const low = name.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  for (const [keywords, icon] of ICON_SUGGEST) {
    if (keywords.some(k => low.includes(k.normalize('NFD').replace(/[̀-ͯ]/g,'')))) return icon;
  }
  return '🏷️';
}

// ---- RRULE HELPERS ----
const WD_LABELS = {MO:'lundi',TU:'mardi',WE:'mercredi',TH:'jeudi',FR:'vendredi',SA:'samedi',SU:'dimanche'};
const WD_SHORT_LABELS = ['L','M','M','J','V','S','D'];
const WD_KEYS = ['MO','TU','WE','TH','FR','SA','SU'];
const ORD_FR = ['','premier','deuxième','troisième','quatrième'];

function rruleDesc(r) {
  if (!r || r.freq === 'NONE') return 'Jamais';
  let base = '';
  if (r.freq === 'DAILY') {
    base = r.interval > 1 ? `Tous les ${r.interval} jours` : 'Chaque jour';
  } else if (r.freq === 'WEEKLY') {
    const days = (r.byDay||[]).map(d=>WD_LABELS[d]).filter(Boolean);
    const daysStr = days.length ? ' · ' + days.join(', ') : '';
    base = r.interval > 1 ? `Toutes les ${r.interval} semaines${daysStr}` : `Chaque semaine${daysStr}`;
  } else if (r.freq === 'MONTHLY') {
    if (r.monthType === 'allWeekdays') {
      const days = (r.byDay||[]).map(d=>WD_LABELS[d]).filter(Boolean);
      const daysStr = days.join('/') || '…';
      base = r.interval>1 ? `Tous les ${r.interval} mois · tous les ${daysStr} du mois` : `Chaque mois · tous les ${daysStr}`;
    } else if (r.monthType === 'weekday') {
      const pos = r.monthPos === -1 ? 'dernier' : (ORD_FR[r.monthPos]||'premier');
      const wd = WD_LABELS[r.monthWd]||'lundi';
      base = r.interval>1 ? `Tous les ${r.interval} mois · le ${pos} ${wd}` : `Chaque mois · le ${pos} ${wd}`;
    } else {
      const day = r.monthDay||1;
      base = r.interval>1 ? `Tous les ${r.interval} mois le ${day}` : `Chaque mois le ${day}`;
    }
  } else if (r.freq === 'YEARLY') {
    if (r.feb29 === 'strict') {
      base = r.interval>1 ? `Tous les ${r.interval} ans · le 29 février (années bissextiles)` : 'Le 29 février (années bissextiles uniquement)';
    } else {
      base = r.interval>1 ? `Tous les ${r.interval} ans` : 'Chaque année';
    }
  }
  if (r.endType === 'until' && r.until) base += ` · jusqu'au ${fmtDateShort(r.until)}`;
  else if (r.endType === 'count') base += ` · ${r.count} fois`;
  return base;
}

/**
 * Retourne true si la règle nécessite l'adaptateur pour être calculée correctement.
 * L'implémentation inline (_rruleNextInline) ne supporte pas ces cas.
 */
function _requiresAdapter(r) {
  if (!r || r.freq === 'NONE') return false;
  if (r.freq === 'MONTHLY' && (r.monthType === 'weekday' || r.monthType === 'allWeekdays')) return true;
  if (r.wkst && r.wkst !== 'MO') return true;
  if (r.feb29) return true;
  return false;
}

/**
 * Calcule les n prochaines occurrences — délègue à rrule-adapter.js si disponible.
 * Fallback inline uniquement pour les règles simples (DAILY, WEEKLY sans WKST, MONTHLY jour fixe, YEARLY).
 * Pour les règles complexes sans adaptateur : retourne [] sans silencer l'erreur.
 * exdates : tableau de dates ISO à exclure (depuis EXDATE).
 */
function rruleNext(r, startIso, n, exdates) {
  if (!r || r.freq === 'NONE') return [];
  if (window._RA) {
    return window._RA.rruleNext(r, startIso, n, exdates || []);
  }
  // Règle complexe sans adaptateur → ne pas produire de résultat approximatif
  if (_requiresAdapter(r)) return [];
  // Fallback inline (si adaptateur pas encore chargé — démarrage de page, règles simples seulement)
  return _rruleNextInline(r, startIso, n);
}

/**
 * Fusionne RRULE + RDATE puis soustrait EXDATE.
 * Délègue à l'adaptateur si disponible, sinon implémentation locale.
 */
function rruleNextMerged(r, startIso, n, exdates, rdates) {
  if (window._RA) {
    const result = window._RA.rruleMergeOccurrences(r, startIso, n, exdates || [], rdates || []);
    return result.dates;
  }
  // Fallback sans adaptateur
  const exSet = new Set(exdates || []);
  const base = _rruleNextInline(r, startIso, n + (exSet.size || 0) + (rdates?.length || 0) + 5);
  const filtered = base.filter(d => !exSet.has(d));
  if (rdates?.length) {
    for (const rd of rdates) {
      if (rd > startIso && !exSet.has(rd) && !filtered.includes(rd)) filtered.push(rd);
    }
    filtered.sort();
  }
  return filtered.slice(0, n);
}

function _rruleNextInline(r, startIso, n) {
  if (!r || r.freq === 'NONE') return [];
  const result = [];
  let d = new Date(startIso + 'T12:00:00');
  let occCount = 0;
  const maxIter = 500;
  let iter = 0;
  while (result.length < n && iter < maxIter) {
    iter++;
    if (r.freq === 'DAILY') {
      d = new Date(d); d.setDate(d.getDate() + (r.interval||1));
    } else if (r.freq === 'WEEKLY') {
      const IV = r.interval || 1;
      const tgDays = (r.byDay||[]).map(wd=>['SU','MO','TU','WE','TH','FR','SA'].indexOf(wd)).filter(x=>x>=0).sort((a,b)=>a-b);
      if (tgDays.length === 0) {
        d = new Date(d); d.setDate(d.getDate() + 7 * IV);
      } else {
        const start = new Date(startIso + 'T12:00:00');
        let nd = new Date(d); nd.setDate(d.getDate() + 1);
        let found = false;
        for (let guard = 0; guard < 400 && !found; guard++) {
          if (tgDays.includes(nd.getDay())) {
            const daysDiff = Math.round((nd - start) / 86400000);
            if (Math.floor(daysDiff / 7) % IV === 0) { d = nd; found = true; }
          }
          if (!found) { nd = new Date(nd); nd.setDate(nd.getDate() + 1); }
        }
        if (!found) break;
      }
    } else if (r.freq === 'MONTHLY') {
      function nthWd(yr, mo, pos, wd) {
        if (pos === -1) {
          const last = new Date(yr, mo+1, 0);
          while (last.getDay() !== wd) last.setDate(last.getDate()-1);
          return new Date(yr, mo, last.getDate(), 12,0,0);
        }
        const first = new Date(yr, mo, 1);
        while (first.getDay() !== wd) first.setDate(first.getDate()+1);
        first.setDate(first.getDate() + 7*(pos-1));
        return new Date(yr, mo, first.getDate(), 12,0,0);
      }
      const IV2 = r.interval || 1;
      const wd2 = ['SU','MO','TU','WE','TH','FR','SA'].indexOf(r.monthWd||'MO');
      const targetDay = r.monthDay || d.getDate();
      let yr = d.getFullYear(), mo = d.getMonth();
      let cand;
      if (r.monthType === 'weekday') {
        cand = nthWd(yr, mo, r.monthPos||1, wd2);
      } else {
        const dim = new Date(yr, mo+1, 0).getDate();
        cand = targetDay > dim ? new Date(0) : new Date(yr, mo, targetDay, 12,0,0);
      }
      if (cand <= d) {
        let guard2 = 0;
        do {
          mo += IV2;
          if (mo > 11) { yr += Math.floor(mo/12); mo %= 12; }
          if (r.monthType === 'weekday') {
            cand = nthWd(yr, mo, r.monthPos||1, wd2);
          } else {
            const dim = new Date(yr, mo+1, 0).getDate();
            cand = targetDay > dim ? new Date(0) : new Date(yr, mo, targetDay, 12,0,0);
          }
        } while (r.monthType !== 'weekday' && cand <= new Date(0) && guard2++ < 24);
      }
      d = cand;
    } else if (r.freq === 'YEARLY') {
      const orig = new Date(startIso + 'T12:00:00');
      const IV = r.interval || 1;
      if (r.feb29 === 'strict') {
        let yr = d.getFullYear() + IV;
        while (new Date(yr, 1, 29).getMonth() !== 1) yr++;
        d = new Date(yr, 1, 29, 12, 0, 0);
      } else {
        const targetYear = d.getFullYear() + IV;
        const dim = new Date(targetYear, orig.getMonth()+1, 0).getDate();
        d = new Date(targetYear, orig.getMonth(), Math.min(orig.getDate(), dim), 12,0,0);
      }
    }
    const iso = d.toISOString().slice(0,10);
    if (r.endType === 'until' && r.until && iso > r.until) break;
    if (r.endType === 'count' && occCount >= (r.count||10)) break;
    result.push(iso);
    occCount++;
  }
  return result;
}

function buildRruleObj() {
  return {
    freq:ES.rrule_freq, interval:ES.rrule_interval, byDay:[...ES.rrule_byDay],
    monthType:ES.rrule_monthType, monthDay:ES.rrule_monthDay, monthPos:ES.rrule_monthPos, monthWd:ES.rrule_monthWd,
    endType:ES.rrule_endType, until:ES.rrule_until, count:ES.rrule_count,
    feb29:ES.rrule_feb29, wkst:ES.rrule_wkst||'MO',
  };
}

// ---- CONTACT PICKER ----
function openContactPicker() {
  collectEditorInputs();
  const list = document.getElementById('contact-list');
  list.innerHTML = DEMO_CONTACTS.map(c => {
    const initials = c.name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
    const sub = [c.type, c.addresses.length>0?c.addresses[0].value:'Pas d\'adresse'].join(' · ');
    const badge = c.addresses.length>1 ? `<span class="contact-badge" style="background:var(--soft);color:var(--muted)">${c.addresses.length} adresses</span>` : (c.addresses.length===0?`<span class="contact-badge" style="background:#FFF8E8;color:#A05C00">Pas d'adr.</span>`:'');
    return `<div class="contact-row" onclick="selectContact('${c.id}')">
      <div class="contact-av">${initials}</div>
      <div style="flex:1;min-width:0">
        <div class="contact-name">${esc(c.name)}</div>
        <div class="contact-sub">${esc(sub)}</div>
      </div>
      ${badge}
    </div>`;
  }).join('');
  document.getElementById('contact-backdrop').classList.add('open');
  document.getElementById('contact-sheet').classList.add('open');
}

function closeContactPicker() {
  document.getElementById('contact-backdrop').classList.remove('open');
  document.getElementById('contact-sheet').classList.remove('open');
}

function selectContact(id) {
  const c = DEMO_CONTACTS.find(x=>x.id===id); if (!c) return;
  ES.contact = c.name;
  ES.phone = c.phone || '';
  ES.email = c.email || '';
  if (c.addresses.length === 0) {
    closeContactPicker(); renderEditorBody();
    toast('Contact sélectionné — saisir le lieu manuellement');
  } else if (c.addresses.length === 1) {
    const addr = c.addresses[0].value;
    closeContactPicker();
    if (ES.lieu && ES.lieu.trim() && ES.lieu !== addr) {
      setTimeout(()=>{ if (confirm(`Remplacer le lieu par "${c.addresses[0].label} : ${addr}" ?`)) ES.lieu=addr; renderEditorBody(); },100);
    } else { ES.lieu=addr; renderEditorBody(); }
  } else {
    closeContactPicker(); openAddrPicker(id);
  }
}

function openAddrPicker(contactId) {
  const c = DEMO_CONTACTS.find(x=>x.id===contactId); if (!c) return;
  document.getElementById('addr-sheet-title').textContent = `Adresse · ${c.name}`;
  document.getElementById('addr-list').innerHTML = c.addresses.map((a,i)=>`<div class="contact-row" onclick="selectContactAddress('${c.id}',${i})">
    <div class="contact-av" style="background:var(--soft);color:var(--muted);font-size:20px">📍</div>
    <div><div class="contact-name">${esc(a.label)}</div><div class="contact-sub">${esc(a.value)}</div></div>
  </div>`).join('');
  document.getElementById('addr-backdrop').classList.add('open');
  document.getElementById('addr-sheet').classList.add('open');
}

function closeAddrPicker() {
  document.getElementById('addr-backdrop').classList.remove('open');
  document.getElementById('addr-sheet').classList.remove('open');
}

function selectContactAddress(contactId, addrIdx) {
  const c = DEMO_CONTACTS.find(x=>x.id===contactId); if (!c) return;
  const addr = c.addresses[addrIdx]?.value; if (!addr) return;
  if (ES.lieu && ES.lieu.trim() && ES.lieu !== addr) {
    closeAddrPicker();
    setTimeout(()=>{ if (confirm(`Remplacer le lieu par "${c.addresses[addrIdx].label} : ${addr}" ?`)) ES.lieu=addr; renderEditorBody(); },100);
  } else { ES.lieu=addr; closeAddrPicker(); renderEditorBody(); }
}

// ---- ITINÉRAIRE ----
function openDetailItineraire(eventId) {
  const ev = EVENTS.find(x=>x.id===eventId); if (!ev||!ev.lieu) return;
  openItineraire(ev.lieu);
}

function openItineraire(lieu) {
  const existing = document.getElementById('itin-menu'); if (existing) { existing.remove(); return; }
  const menu = document.createElement('div');
  menu.id = 'itin-menu';
  menu.style.cssText = 'position:fixed;bottom:20px;left:16px;right:16px;background:var(--surface);border-radius:var(--r-md);box-shadow:0 8px 32px rgba(0,0,0,.18);z-index:200;overflow:hidden';
  function mkItem(icon, label, sub, fn) {
    const d = document.createElement('div');
    d.style.cssText = 'padding:14px 16px;cursor:pointer;font-size:14px;font-weight:500;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px';
    d.innerHTML = `<span>${icon}</span><span>${label}</span><span style="font-size:12px;color:var(--muted);margin-left:4px">${sub}</span>`;
    d.addEventListener('click', ()=>{ menu.remove(); fn(); }); return d;
  }
  const title = document.createElement('div');
  title.style.cssText = 'padding:12px 16px;border-bottom:1px solid var(--line)';
  title.innerHTML = `<div style="font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">Itinéraire</div><div style="font-size:13px;color:var(--ink);font-weight:500">${esc(lieu)}</div>`;
  menu.appendChild(title);
  menu.appendChild(mkItem('🗺','Plans (Apple)','· simulé',()=>toast('Plans Apple — simulé, prototype',2000)));
  menu.appendChild(mkItem('📍','Google Maps','· simulé',()=>toast('Google Maps — simulé, prototype',2000)));
  menu.appendChild(mkItem('📋','Copier l\'adresse','',()=>{ if(navigator.clipboard) navigator.clipboard.writeText(lieu).then(()=>toast('Adresse copiée ✓')); else toast('Adresse copiée ✓'); }));
  const cancel = document.createElement('div');
  cancel.style.cssText = 'padding:14px 16px;cursor:pointer;font-size:14px;font-weight:500;text-align:center;color:var(--muted)';
  cancel.textContent = 'Annuler';
  cancel.addEventListener('click',()=>menu.remove());
  menu.appendChild(cancel);
  document.body.appendChild(menu);
  setTimeout(()=>{ document.addEventListener('click',function closer(ev){ if(!menu.contains(ev.target)){menu.remove();document.removeEventListener('click',closer);}},{once:false}); },100);
}

function collectEditorInputs() {
  const f = id => { const el=document.getElementById(id); return el ? el.value : null; };
  if (f('etitle')!==null) ES.title = f('etitle').trim();
  if (f('elieu')!==null)  ES.lieu = f('elieu');
  if (f('eurl')!==null)   ES.url = f('eurl').trim();
  if (f('econtact')!==null) ES.contact = f('econtact');
  if (f('enotes')!==null) ES.notes = f('enotes');
  if (f('estart_date')!==null) ES.start_date = f('estart_date');
  if (f('estart_time')!==null) ES.start_time = f('estart_time');
  if (f('eend_date')!==null)   ES.end_date = f('eend_date');
  if (f('eend_time')!==null)   ES.end_time = f('eend_time');
  if (f('edue_date')!==null)   ES.due_date = f('edue_date');
  if (f('edue_time')!==null)   ES.due_time = f('edue_time');
  if (f('enewcat-name')!==null) ES.newCatName = f('enewcat-name');
  if (f('ecustom-rem')!==null) ES.customRemMin = parseInt(f('ecustom-rem'))||60;
  if (f('errule_interval')!==null) ES.rrule_interval = parseInt(f('errule_interval'))||1;
  if (f('errule_count')!==null) ES.rrule_count = parseInt(f('errule_count'))||1;
  if (f('errule_until')!==null) ES.rrule_until = f('errule_until');
  if (f('errule_monthday')!==null) ES.rrule_monthDay = parseInt(f('errule_monthday'))||1;
  if (f('ephone')!==null) ES.phone = f('ephone');
  if (f('eemail')!==null) ES.email = f('eemail');
}

  document.getElementById('fab-menu').classList.remove('open');
  ES.editId = editId || null;
  if (editId) {
    const e = EVENTS.find(x=>x.id===editId);
    if (e) {
      ES.type = e.type || type || 'event';

      ES.notes=e.notes||''; ES.lieu=e.lieu||''; ES.url=e.url||''; ES.contact=e.contact||'';
      ES.phone=e.phone||''; ES.email=e.email||'';
      ES.icon=e.icon||'📅'; ES.color=e.color||'#4C8DF6'; ES.cal=e.cal||'Agenda Famille';
      ES.allday=!!e.allday; ES.start_date=e.date||today(); ES.start_time=e.start||'09:00';
      ES.end_date=e.end_date||e.date||today(); ES.end_time=e.end||'10:00';
      ES.timezone=e.timezone||'Europe/Paris'; ES.travel=e.travel||'Aucun';
      ES.countdown=!!e.countdown; ES.state=e.state||'todo';
      ES.due_date=e.date||today(); ES.due_time=e.due_time||'';
      ES.report=!!e.report; ES.assignee=e.assignee||'f';
      // RRULE: load from saved object or map legacy string
      if (e.rrule && e.rrule.freq) {
        ES.rrule_freq=e.rrule.freq; ES.rrule_interval=e.rrule.interval||1;
        ES.rrule_byDay=[...(e.rrule.byDay||[])]; ES.rrule_monthType=e.rrule.monthType||'day';
        ES.rrule_monthDay=e.rrule.monthDay||1; ES.rrule_monthPos=e.rrule.monthPos||1;
        ES.rrule_monthWd=e.rrule.monthWd||'MO'; ES.rrule_endType=e.rrule.endType||'never';
        ES.rrule_until=e.rrule.until||''; ES.rrule_count=e.rrule.count||10;
        ES.rrule_feb29=e.rrule.feb29||'last_feb'; ES.rrule_wkst=e.rrule.wkst||'MO';
        ES.ev_exdates=[...(e.exdates||[])]; ES.ev_rdates=[...(e.rdates||[])];
      } else {
        const legacyMap={'Chaque jour':'DAILY','Chaque semaine':'WEEKLY','Chaque 2 semaines':'WEEKLY','Chaque mois':'MONTHLY','Chaque année':'YEARLY'};
        ES.rrule_freq=legacyMap[e.repeat||'']||'NONE';
        ES.rrule_interval=e.repeat==='Chaque 2 semaines'?2:1;
        ES.rrule_byDay=[]; ES.rrule_monthType='day'; ES.rrule_monthDay=1;
        ES.rrule_monthPos=1; ES.rrule_monthWd='MO'; ES.rrule_endType='never'; ES.rrule_until=''; ES.rrule_count=10;
      }
    }
  } else {
    ES.type=type||'event'; ES.title=''; ES.notes=''; ES.lieu=''; ES.url=''; ES.contact='';
    ES.phone=''; ES.email='';
    ES.reminders=[]; ES.members=['f']; ES.repeat='Jamais';
    ES.allday=false; ES.countdown=false; ES.report=false; ES.state='todo';
    ES.icon='📅'; ES.color='#4C8DF6'; ES.cal='Agenda Famille';
    ES.start_date=today(); ES.start_time='09:00'; ES.end_date=today(); ES.end_time='10:00';
    ES.timezone='Europe/Paris'; ES.travel='Aucun'; ES.assignee='f';
    ES.due_date=addDays(today(),1); ES.due_time='';
    ES.rrule_freq='NONE'; ES.rrule_interval=1; ES.rrule_byDay=[];
    ES.rrule_monthType='day'; ES.rrule_monthDay=1; ES.rrule_monthPos=1; ES.rrule_monthWd='MO';
    ES.rrule_endType='never'; ES.rrule_until=''; ES.rrule_count=10; ES.rrule_feb29='last_feb'; ES.rrule_wkst='MO';
    ES.ev_exdates=[]; ES.ev_rdates=[];
  }
  ES.showIconPicker=false; ES.showColorPicker=false; ES.showRemPicker=false;
  ES.showNewCat=false; ES.showCustomRem=false;
  document.querySelectorAll('.etype').forEach((b,i)=>b.classList.toggle('active',['event','rdv','task'][i]===ES.type));
  const H = editId
    ? {event:'Modifier l\'événement',rdv:'Modifier le rendez-vous',task:'Modifier la tâche'}
    : {event:'Nouvel événement',rdv:'Nouveau rendez-vous',task:'Nouvelle tâche'};
  document.getElementById('editor-heading').textContent = H[ES.type]||'Modifier';
  renderEditorBody();
  document.getElementById('editor').classList.add('open');
  setTimeout(()=>{ const el=document.getElementById('etitle'); if(el) el.focus(); },300);
}

function closeEditor() { document.getElementById('editor').classList.remove('open'); }

function saveEditor() {
  collectEditorInputs();
  if (!ES.title) { toast('Le titre est obligatoire.'); document.getElementById('etitle')&&document.getElementById('etitle').focus(); return; }
  if (ES.type!=='task' && !ES.allday) {
    if (ES.end_date < ES.start_date || (ES.end_date===ES.start_date && ES.end_time<=ES.start_time)) {
      toast('La fin doit être après le début.'); return;
    }
  }
  // Bloquer l'enregistrement si la règle de récurrence nécessite l'adaptateur mais qu'il n'est pas chargé.
  // Enregistrer avec un moteur approximatif entraînerait des données incorrectes silencieuses.
  if (!window._RA && _requiresAdapter(buildRruleObj())) {
    toast('⚠️ Adaptateur de récurrence non chargé — rafraîchissez la page avant d\'enregistrer.'); return;
  }
  if (ES.url && !/^https?:\/\//i.test(ES.url)) ES.url = 'https://'+ES.url;
  const ev = buildEvent();
  if (ES.editId) {
    const idx = EVENTS.findIndex(e=>e.id===ES.editId);
    if (idx>=0) EVENTS[idx]=ev; else EVENTS.push(ev);
  } else {
    EVENTS.push(ev);
  }
  dbSave();
  closeEditor();
  renderCurrentView();
  toast(ES.editId ? 'Modifications enregistrées ✓' : 'Créé ✓');
}

function buildEvent() {
  const rrule = buildRruleObj();
  const repeatStr = rruleDesc(rrule);
  // seriesId : identifiant stable de la série. Conservé à la modification, créé à la création.
  const existingEvent = ES.editId ? EVENTS.find(e=>e.id===ES.editId) : null;
  const seriesId = (existingEvent?.seriesId) || (rrule.freq !== 'NONE' ? newId() : null);
  const base = {
    id: ES.editId||newId(), type:ES.type, title:ES.title, cat:ES.cat,
    members:[...ES.members], reminders:[...ES.reminders],
    repeat:repeatStr, rrule:rrule, notes:ES.notes, lieu:ES.lieu,
    seriesId: seriesId,
    exdates:[...(ES.ev_exdates||[])],
    rdates:[...(ES.ev_rdates||[])],
  };
  if (ES.type==='task') {
    return {...base, date:ES.due_date, allday:true,
      state:ES.state, due_time:ES.due_time, report:ES.report, assignee:ES.assignee};
  }
  return {...base, date:ES.start_date,
    start:ES.allday?'':ES.start_time, end:ES.allday?'':ES.end_time,
    end_date:ES.end_date, allday:ES.allday, url:ES.url,
    icon:ES.icon, color:ES.color, cal:ES.cal,
    timezone:ES.timezone, travel:ES.travel, countdown:ES.countdown,
    ...(ES.type==='rdv'?{contact:ES.contact,phone:ES.phone,email:ES.email}:{}),
  };
}

function deleteEvent(id) {
  EVENTS = EVENTS.filter(e=>e.id!==id);
  dbSave(); closeDetail(); renderCurrentView(); toast('Supprimé');
}

function setEType(btn, type) {
  collectEditorInputs();
  ES.type=type; ES.showIconPicker=false; ES.showColorPicker=false; ES.showRemPicker=false; ES.showNewCat=false; ES.showCustomRem=false;
  document.querySelectorAll('.etype').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  const H = ES.editId
    ? {event:'Modifier l\'événement',rdv:'Modifier le rendez-vous',task:'Modifier la tâche'}
    : {event:'Nouvel événement',rdv:'Nouveau rendez-vous',task:'Nouvelle tâche'};
  document.getElementById('editor-heading').textContent = H[type]||'Nouveau';
  renderEditorBody();
}

function eToggle(key) { collectEditorInputs(); ES[key]=!ES[key]; renderEditorBody(); }
function eCycle(key, opts) { collectEditorInputs(); const i=opts.indexOf(ES[key]); ES[key]=opts[(i+1)%opts.length]; renderEditorBody(); }
function eSetIcon(ic) { ES.icon=ic; ES.showIconPicker=false; renderEditorBody(); }
function eSetColor(c) { ES.color=c; ES.showColorPicker=false; renderEditorBody(); }
function eSelectCat(id) { ES.cat=id; renderEditorBody(); }
function eToggleMember(id) {
  const idx=ES.members.indexOf(id);
  if (idx>=0) ES.members.splice(idx,1); else ES.members.push(id);
  renderEditorBody();
}
function eToggleAssignee() {
  collectEditorInputs();
  const ids=MEMBERS.map(m=>m.id);
  ES.assignee=ids[(ids.indexOf(ES.assignee)+1)%ids.length];
  renderEditorBody();
}
function eAddReminder(r) {
  collectEditorInputs();
  const key=JSON.stringify(r);
  if (!ES.reminders.some(x=>JSON.stringify(x)===key)) ES.reminders.push(r);
  ES.showRemPicker=false; ES.showCustomRem=false; renderEditorBody();
}
function eAddCustomRem() {
  collectEditorInputs();
  const val=parseInt(document.getElementById('ecustom-rem')?.value)||ES.customRemMin||60;
  const mult={min:1,h:60,j:1440}[ES.customRemUnit||'min']||1;
  const min=val*mult;
  if (!val||val<1||min>10080) { toast('Durée invalide (max 1 semaine)'); return; }
  eAddReminder({type:'custom',min});
}
function eDelReminder(i) { ES.reminders.splice(i,1); renderEditorBody(); }
function eAddExdate() {
  const val = document.getElementById('eadd-exdate')?.value;
  if (!val) return;
  if (!(ES.ev_exdates||[]).includes(val)) {
    if (!ES.ev_exdates) ES.ev_exdates = [];
    ES.ev_exdates.push(val);
    ES.ev_exdates.sort();
  }
  renderEditorBody();
}
function eRemoveExdate(i) {
  if (ES.ev_exdates) ES.ev_exdates.splice(i, 1);
  renderEditorBody();
}
function eToggleRemPicker() { collectEditorInputs(); ES.showRemPicker=!ES.showRemPicker; ES.showCustomRem=false; renderEditorBody(); }
function eToggleCustomRem() { ES.showCustomRem=!ES.showCustomRem; renderEditorBody(); }
function eOpenNewCat() { collectEditorInputs(); ES.showNewCat=true; ES.newCatName=''; ES.newCatColorIdx=0; renderEditorBody(); setTimeout(()=>{ const el=document.getElementById('enewcat-name'); if(el) el.focus(); },50); }
function eCloseNewCat() { ES.showNewCat=false; renderEditorBody(); }
function eSetNewCatColor(i) { ES.newCatColorIdx=i; renderEditorBody(); }
function eConfirmNewCat() {
  const name=(document.getElementById('enewcat-name')?.value.trim())||ES.newCatName;
  if (!name) return;
  const pal=NEWCAT_PALETTE[ES.newCatColorIdx];
  const icon=suggestCatIcon(name);

// ---- CATEGORY MANAGER ----
function eOpenCatMgr() { collectEditorInputs(); ES.showCatMgr=true; ES.editingCatId=null; ES.deletingCatId=null; renderEditorBody(); }
function eCloseCatMgr() { ES.showCatMgr=false; ES.editingCatId=null; ES.deletingCatId=null; renderEditorBody(); }
function eStartEditCat(id) {
  const c=CATS.find(x=>x.id===id); if (!c) return;
  ES.editingCatId=id; ES.editCatName=c.label; ES.editCatIcon=c.icon;
  ES.editCatColorIdx=NEWCAT_PALETTE.findIndex(p=>p.dot===c.dot); if(ES.editCatColorIdx<0) ES.editCatColorIdx=0;

}
function eSaveCatEdit() {
  const name=(document.getElementById('ecatmgr-name')?.value.trim())||ES.editCatName; if (!name) return;
  const c=CATS.find(x=>x.id===ES.editingCatId); if (!c) return;
  const pal=NEWCAT_PALETTE[ES.editCatColorIdx];
  c.label=name; c.icon=ES.editCatIcon; c.dot=pal.dot; c.bg=pal.bg; c.ink=pal.ink;

}
function eCancelCatEdit() { ES.editingCatId=null; renderEditorBody(); }
function eSetEditCatIcon(icon) { ES.editCatIcon=icon; renderEditorBody(); }
function eSetEditCatColor(i) { ES.editCatColorIdx=i; renderEditorBody(); }
function eStartDeleteCat(id) {
  ES.deletingCatId=id; ES.deleteCatReassignId=''; ES.editingCatId=null; renderEditorBody();
}
function eCancelDeleteCat() { ES.deletingCatId=null; renderEditorBody(); }
function eConfirmDeleteCat() {
  const id=ES.deletingCatId; if (!id) return;

  EVENTS.forEach(e=>{ if(e.cat===id) e.cat=reassign; });

  ES.deletingCatId=null; dbSave(); renderEditorBody();
