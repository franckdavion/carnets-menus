// ---- DETAIL SHEET ----
function openDetail(id) {
  const e = EVENTS.find(x=>x.id===id); if (!e) return;
  const cat = getcat(e.cat);
  const isTask = e.type === 'task';
  const mems = (e.members||[]).map(mid=>getmember(mid)).filter(Boolean);
  const displayIcon = e.icon || cat.icon;
  document.getElementById('detail-header').innerHTML = `
    <div class="detail-icon" style="background:${cat.bg}">${displayIcon}</div>
    <div class="detail-info">
      <div class="detail-title">${esc(e.title)}</div>
      <div class="detail-cat" style="color:${cat.ink}">${cat.label}</div>
    </div>`;
  const rows = [];
  // ── countdown helper (works from NOW to event date/time) ──
  function calcCountdown(isoDate, startTime) {
    try {
      const target = new Date((isoDate||today())+'T'+(startTime||'00:00')+':00');
      const diffMs = target - NOW;
      if (diffMs <= 0) return null;
      const diffMn = Math.floor(diffMs/60000);
      if (diffMn < 60) return `Dans ${diffMn} min`;
      const diffH = Math.floor(diffMn/60);
      if (diffH < 24) return `Dans ${diffH} h ${diffMn%60 ? (diffMn%60)+' min' : ''}`.trim();
      const diffD = Math.floor(diffH/24);
      if (diffH%24) return `Dans ${diffD} j ${diffH%24} h`;
      return `Dans ${diffD} jour${diffD>1?'s':''}`;
    } catch { return null; }
  }

  // ── travel time helper ──
  function calcDeparture(startTime, travelStr) {
    if (!startTime || !travelStr || travelStr==='Aucun') return null;
    const travelMap = {'5 min':5,'10 min':10,'15 min':15,'30 min':30,'45 min':45,'1 h':60,'1 h 30':90};
    const travelMin = travelMap[travelStr];
    if (!travelMin) return null;
    const [h,m] = startTime.split(':').map(Number);
    const totalMin = h*60+m-travelMin;
    if (totalMin<0) return null;
    return String(Math.floor(totalMin/60)).padStart(2,'0')+':'+String(totalMin%60).padStart(2,'0');
  }

  // ── next repeat occurrences helper ──
  function nextOccurrences(startDate, repeat, count) {
    if (!repeat || repeat==='Jamais') return [];
    const result = [];
    let d = new Date(startDate+'T12:00:00');
    for (let i=0; i<count; i++) {
      if (repeat==='Chaque jour') d.setDate(d.getDate()+1);
      else if (repeat==='Chaque semaine') d.setDate(d.getDate()+7);
      else if (repeat==='Chaque 2 semaines') d.setDate(d.getDate()+14);
      else if (repeat==='Chaque mois') d.setMonth(d.getMonth()+1);
      else if (repeat==='Chaque année') d.setFullYear(d.getFullYear()+1);
      else break;
      result.push(d.toISOString().slice(0,10));
    }
    return result;
  }

  // Date / heure
  if (isTask) {
    const dueDate = e.date || e.due_date;
    const dueStr = dueDate ? fmtDateShort(dueDate) : '—';
    const timeStr = e.due_time ? ' à ' + e.due_time : '';
    rows.push(`<div class="detail-row"><span class="detail-row-icon">📋</span><div><div class="detail-row-text">Tâche · ${e.state==='done'?'✅ Terminée':'📋 En cours'}</div><div class="detail-row-sub">Échéance : ${dueStr}${timeStr}</div></div></div>`);
    const assignee = getmember(e.assignee);
    if (assignee) rows.push(`<div class="detail-row"><span class="detail-row-icon">👤</span><div class="detail-row-text">${esc(assignee.name)}</div></div>`);
    if (e.report) {
      let reportSub = 'Prototype : la tâche sera replanifiée automatiquement';
      if (e.state==='done' && dueDate) {
        const nextDue = addDays(dueDate, 1);
        reportSub = `Prochaine échéance simulée : ${fmtDateShort(nextDue)}`;
      }
      rows.push(`<div class="detail-row"><span class="detail-row-icon">↩️</span><div><div class="detail-row-text">Report automatique</div><div class="detail-row-sub">${reportSub}</div></div></div>`);
    }
    // Countdown for task due date
    if (dueDate && e.state !== 'done') {
      const cd = calcCountdown(dueDate, e.due_time||'00:00');
      if (cd) rows.push(`<div class="detail-row"><span class="detail-row-icon">⏳</span><div><div class="detail-row-text">${cd}</div><div class="detail-row-sub">avant l'échéance</div></div></div>`);
    }
  } else if (!e.allday && e.start) {
    const dateStr = fmtDateShort(e.date);
    const endDateStr = (e.end_date && e.end_date !== e.date) ? ' → ' + fmtDateShort(e.end_date) : '';
    const tzSuffix = (e.timezone && e.timezone !== 'Europe/Paris') ? ` <span style="font-size:11px;color:var(--muted)">${esc(e.timezone)}</span>` : '';
    rows.push(`<div class="detail-row"><span class="detail-row-icon">🕐</span><div><div class="detail-row-text">${e.start}${e.end?' – '+e.end:''}${tzSuffix}</div><div class="detail-row-sub">${dateStr}${endDateStr}</div></div></div>`);
    // Countdown to event
    const cd = calcCountdown(e.date, e.start);
    if (cd) rows.push(`<div class="detail-row"><span class="detail-row-icon">⏳</span><div><div class="detail-row-text">${cd}</div><div class="detail-row-sub">avant le début de l'événement</div></div></div>`);
  } else {
    rows.push(`<div class="detail-row"><span class="detail-row-icon">📅</span><div class="detail-row-text">${fmtDateShort(e.date)}</div></div>`);
  }
  // Lieu (avec bouton itinéraire)
  if (e.lieu) rows.push(`<div class="detail-row"><span class="detail-row-icon">📍</span><div><div class="detail-row-text">${esc(e.lieu)}</div><button class="itineraire-btn" onclick="openDetailItineraire('${e.id}');event.stopPropagation()">🗺 Itinéraire</button></div></div>`);
  // Contact / praticien (rdv) avec phone + email
  if (e.contact) rows.push(`<div class="detail-row"><span class="detail-row-icon">👨‍⚕️</span><div><div class="detail-row-text">${esc(e.contact)}</div>${e.phone?`<div class="detail-row-sub">📞 ${esc(e.phone)}</div>`:''}${e.email?`<div class="detail-row-sub">✉️ ${esc(e.email)}</div>`:''}</div></div>`);
  // URL
  if (e.url) rows.push(`<div class="detail-row"><span class="detail-row-icon">🔗</span><div class="detail-row-text"><a href="${esc(e.url)}" target="_blank" style="color:var(--accent)">${esc(e.url.replace(/^https?:\/\//,''))}</a></div></div>`);
  // Participants
  if (mems.length) {
    const avaHtml = mems.map(m=>`<div class="event-avatar" style="background:${m.color}">${m.initials}</div>`).join('');
    rows.push(`<div class="detail-row"><span class="detail-row-icon">👥</span><div style="display:flex;align-items:center;gap:8px"><div class="event-avatars">${avaHtml}</div><span class="detail-row-text">${mems.map(m=>esc(m.name)).join(', ')}</span></div></div>`);
  }
  // Rappels
  const rems = e.reminders || [];
  if (rems.length) {
    const remStrs = rems.map(r=>fmtRemLabel(r)).filter(Boolean);
    if (remStrs.length === 1) {
      rows.push(`<div class="detail-row"><span class="detail-row-icon">🔔</span><div class="detail-row-text">${esc(remStrs[0])}</div></div>`);
    } else {
      rows.push(`<div class="detail-row"><span class="detail-row-icon">🔔</span><div><div class="detail-row-text">Rappels (${remStrs.length})</div>${remStrs.map(s=>`<div class="detail-row-sub">• ${esc(s)}</div>`).join('')}</div></div>`);
    }
  }
  // Répétition + prochaines occurrences
  if (e.repeat && e.repeat !== 'Jamais') {
    let nexts, repeatLabel;
    if (e.rrule && e.rrule.freq && e.rrule.freq !== 'NONE') {
      nexts = rruleNext(e.rrule, e.date||today(), 2);
      repeatLabel = rruleDesc(e.rrule);
    } else {
      nexts = nextOccurrences(e.date||today(), e.repeat, 2);
      repeatLabel = e.repeat;
    }
    const nextStr = nexts.length ? ' · Suivantes : ' + nexts.map(fmtDateShort).join(', ') : '';
    rows.push(`<div class="detail-row"><span class="detail-row-icon">🔄</span><div><div class="detail-row-text">${esc(repeatLabel)}</div><div class="detail-row-sub">Prototype – occurrences simulées${nextStr}</div></div></div>`);
  }
  // Agenda / calendrier
  if (e.cal) rows.push(`<div class="detail-row"><span class="detail-row-icon">📆</span><div class="detail-row-text">${esc(e.cal)}</div></div>`);
  // Temps de trajet + heure de départ calculée
  if (e.travel && e.travel !== 'Aucun') {
    const dep = calcDeparture(e.start, e.travel);
    const depStr = dep ? ` — Départ à ${dep}` : '';
    rows.push(`<div class="detail-row"><span class="detail-row-icon">🚗</span><div><div class="detail-row-text">Trajet : ${esc(e.travel)}${depStr}</div><div class="detail-row-sub">Prototype – alerte départ simulée, non envoyée</div></div></div>`);
  }
  // Compte à rebours (événement)
  if (e.countdown && !isTask) {
    const cd2 = calcCountdown(e.date, e.start);
    rows.push(`<div class="detail-row"><span class="detail-row-icon">⏱️</span><div><div class="detail-row-text">Compte à rebours${cd2?' : '+cd2:''}</div><div class="detail-row-sub">affiché dans la liste des événements</div></div></div>`);
  }
  // Notes
  if (e.notes) rows.push(`<div class="detail-row" style="align-items:flex-start"><span class="detail-row-icon">📝</span><div class="detail-row-text" style="white-space:pre-wrap">${esc(e.notes)}</div></div>`);
  document.getElementById('detail-rows').innerHTML = rows.join('');
  // Boutons Modifier / Supprimer
  document.getElementById('detail-edit-btn').onclick = () => { closeDetail(); openEditor(e.type, id); };
  document.getElementById('detail-del-btn').onclick = () => {
    if (confirm('Supprimer « ' + e.title + ' » ?')) deleteEvent(id);
  };
  document.getElementById('detail-backdrop').classList.add('open');
  document.getElementById('detail-sheet').classList.add('open');
}
function closeDetail() {
  document.getElementById('detail-backdrop').classList.remove('open');
  document.getElementById('detail-sheet').classList.remove('open');
}

// ---- SEARCH ----
function openSearch() {
  const o = document.getElementById('search-overlay');
  o.classList.add('open');
  setTimeout(()=>document.getElementById('search-input').focus(), 100);
}
function closeSearch() {
  document.getElementById('search-overlay').classList.remove('open');
  document.getElementById('search-input').value = '';
  document.getElementById('search-results').innerHTML = '<div class="search-hint">Tapez pour rechercher</div>';
}
function renderSearch(q) {
  const r = document.getElementById('search-results');
  if (!q.trim()) { r.innerHTML = '<div class="search-hint">Tapez pour rechercher</div>'; return; }
  const matches = EVENTS.filter(e=>e.title.toLowerCase().includes(q.toLowerCase()));
  if (!matches.length) { r.innerHTML = '<div class="search-hint">Aucun résultat</div>'; return; }
  r.innerHTML = matches.map(e=>renderEventCard(e)).join('');
}

// ---- INIT ----
dbLoad();
renderList();
</script>

<!-- Chargement des adaptateurs isolés (ES modules) -->
<!-- Exposés sur window._RA et window._RemA pour le code inline -->
<!-- Le code inline fonctionne en fallback si ce script est bloqué -->
<script type="module">
  import * as RA from './adapters/rrule-adapter.js';
  import * as RemA from './adapters/reminder-adapter.js';
  window._RA = RA;
  window._RemA = RemA;
  // Rafraîchir l'éditeur si ouvert au moment du chargement (edge case)
  const editor = document.getElementById('editor-panel');
  if (editor && editor.classList.contains('open')) {
    if (typeof renderEditorBody === 'function') renderEditorBody();
  }
</script>
</body>
