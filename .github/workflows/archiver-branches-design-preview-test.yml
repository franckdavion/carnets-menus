name: Archiver puis ranger deux anciennes branches de présentation

on:
  push:
    branches: [test]
    paths:
      - ".github/workflows/archiver-branches-design-preview-test.yml"

permissions:
  contents: read

concurrency:
  group: archiver-design-preview-20261106
  cancel-in-progress: false

jobs:
  simulation:
    if: github.repository == 'franckdavion/carnets-menus' && github.ref == 'refs/heads/test'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Comparer les deux anciennes branches sans changer GitHub
        run: node scripts/archivage-branches-design-preview-20261106.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCHIVE_MODE: simulation

  archives:
    needs: simulation
    if: github.repository == 'franckdavion/carnets-menus' && github.ref == 'refs/heads/test'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Créer et vérifier deux étiquettes Git contenant les anciens commits
        run: node scripts/archivage-branches-design-preview-20261106.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCHIVE_MODE: archivage
          ARCHIVE_CONFIRMATION: ARCHIVER-AVANT-DE-SUPPRIMER-20261106

  rangement:
    needs: archives
    if: github.repository == 'franckdavion/carnets-menus' && github.ref == 'refs/heads/test'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Revérifier les deux sauvegardes puis retirer les branches anciennes
        run: node scripts/archivage-branches-design-preview-20261106.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCHIVE_MODE: suppression
          ARCHIVE_CONFIRMATION: ARCHIVER-AVANT-DE-SUPPRIMER-20261106
