<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maisonnée</title>
<meta name="description" content="Les tâches, l'agenda et les repas de la maison, partagés entre vous.">
<meta name="theme-color" content="#2E6A57" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131B19" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Maisonnée">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1EC; --surface:#FFFFFF; --soft:#E3EAE4; --line:#D5DDD7;
  --ink:#1E2B2A; --muted:#5F6D69; --accent:#2E6A57; --on-accent:#FFFFFF;
  --danger:#B43A28; --late:#B43A28;
  --r-sm:10px; --r-md:16px; --r-lg:24px;
  --display:"Bricolage Grotesque", ui-rounded, system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", system-ui, -apple-system, sans-serif;
  --tabbar:64px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#131B19; --surface:#1C2624; --soft:#24312D; --line:#2F3D39;
    --ink:#E7EEEA; --muted:#98A7A2; --accent:#7BBFA4; --on-accent:#0F1715;
    --danger:#EF8B78; --late:#EF8B78; color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 var(--body);
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:5;background:var(--bg);
  padding:calc(env(safe-area-inset-top) + 10px) 0 8px}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px}
.hh-name{font:700 17px/1.2 var(--display);letter-spacing:-.01em;background:none;border:0;padding:6px 0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60%}
.stack{display:flex;background:none;border:0;padding:4px}
.stack .av{margin-left:-8px;box-shadow:0 0 0 2px var(--bg)}
.stack .av:first-child{margin-left:0}
.sync{font-size:13px;color:var(--muted)}

main.wrap{padding-bottom:calc(var(--tabbar) + env(safe-area-inset-bottom) + 88px)}

/* ---------- headings ---------- */
h1.day{font:800 clamp(34px,9vw,44px)/1.02 var(--display);letter-spacing:-.03em;margin:8px 0 6px}
h2{font:700 21px/1.2 var(--display);letter-spacing:-.015em;margin:28px 0 10px}
h3{font:700 17px/1.25 var(--display);margin:0}
.muted{color:var(--muted)}
.small{font-size:14px}
p{margin:0 0 10px}

/* ---------- the day ribbon: one segment per task, filled with the colour of whoever did it ---------- */
.ribbon{display:flex;gap:4px;height:14px;margin:14px 0 6px}
.ribbon i{flex:1;border-radius:4px;background:var(--soft);border:1px solid var(--line)}
.ribbon i.done{border-color:transparent}
.ribbon-cap{font-size:15px;color:var(--muted);margin:0}

/* ---------- avatars ---------- */
.av{--c:var(--accent);width:30px;height:30px;border-radius:50%;flex:none;display:inline-grid;place-items:center;
  background:var(--c);color:#fff;font:700 14px/1 var(--display);text-transform:uppercase}
.av.lg{width:40px;height:40px;font-size:17px}
.av.sm{width:22px;height:22px;font-size:11px}
.av.any{background:transparent;color:var(--muted);border:2px dashed var(--line)}

/* ---------- member filter ---------- */
.who{display:flex;gap:8px;overflow-x:auto;padding:4px 0 2px;margin:14px -16px 0;padding-inline:16px;scrollbar-width:none}
.who::-webkit-scrollbar{display:none}
.who button{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);
  border-radius:999px;padding:4px 12px 4px 4px;white-space:nowrap;font-size:15px}
.who button.plain{padding:7px 14px}
.who button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* ---------- lists ---------- */
.list{background:var(--surface);border-radius:var(--r-md);border:1px solid var(--line);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);min-height:58px;
  background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.row:first-child{border-top:0}
.row .main{flex:1;min-width:0}
.row .t{display:block;font-weight:700;overflow-wrap:anywhere}
.row .m{display:block;font-size:14px;color:var(--muted);margin-top:1px}
.row .m .late{color:var(--late);font-weight:700}
.row.is-done .t{text-decoration:line-through;text-decoration-thickness:2px;color:var(--muted)}
.row button.open{all:unset;flex:1;min-width:0;cursor:pointer}
.row button.open:focus-visible{outline:3px solid var(--accent);outline-offset:4px;border-radius:4px}
.group-h{font:700 15px/1.2 var(--body);color:var(--muted);margin:22px 4px 8px}
.group-h.late{color:var(--late)}

/* the check: a ring in the assignee's colour that fills when done */
.check{--c:var(--ink);flex:none;width:34px;height:34px;border-radius:50%;border:2.5px solid var(--c);
  background:transparent;display:grid;place-items:center;padding:0;transition:background .18s}
.check svg{width:18px;height:18px;stroke:#fff;stroke-width:3;fill:none;stroke-dasharray:24;stroke-dashoffset:24}
.check.on{background:var(--c)}
.check.on svg{stroke-dashoffset:0;transition:stroke-dashoffset .25s .08s ease-out}
.check.any{--c:var(--muted);border-style:dashed}
.check.any.on{border-style:solid}
@media (prefers-reduced-motion: reduce){.check,.check svg{transition:none!important}}

.tag{display:inline-flex;align-items:center;gap:5px}
.tag .av{vertical-align:middle}

/* ---------- cards on today ---------- */
.meal-line{display:grid;grid-template-columns:56px 1fr;gap:10px;align-items:baseline}
.meal-line b{font:700 14px var(--body);color:var(--muted)}
.ev-time{flex:none;width:64px;white-space:nowrap;font:700 15px/1.2 var(--display);font-variant-numeric:tabular-nums}
.ev-time.allday{font-size:13px;color:var(--muted);font-family:var(--body)}

/* ---------- empty states ---------- */
.empty{padding:22px 18px;text-align:left;border:1.5px dashed var(--line);border-radius:var(--r-md);color:var(--muted)}
.empty strong{display:block;color:var(--ink);font:700 17px var(--display);margin-bottom:4px}
.empty .btn{margin-top:12px}

/* ---------- buttons, chips, fields ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 18px;
  border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:700}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.ink{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.danger{color:var(--danger)}
.btn.block{width:100%}
.btn.ghost{background:none;border-color:transparent;padding-inline:10px}
.btn:disabled{opacity:.5}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.linkbtn{background:none;border:0;padding:6px 0;color:var(--accent);font-weight:700;text-decoration:underline;text-underline-offset:3px}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:15px;
  display:inline-flex;align-items:center;gap:6px;min-height:38px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .av{margin-left:-6px}

.field{display:block;margin:16px 0 0}
.field>.label{display:block;font-weight:700;font-size:15px;margin-bottom:6px}
.input,select.input,textarea.input{width:100%;min-height:48px;padding:11px 14px;border-radius:var(--r-sm);
  border:1px solid var(--line);background:var(--surface);font-size:17px}
textarea.input{min-height:84px;resize:vertical}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.inline{display:flex;gap:8px;align-items:center}
.inline .input{flex:1}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px}
.switch input{width:46px;height:28px;appearance:none;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .15s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{transform:translateX(18px)}

/* ---------- segmented control ---------- */
.seg{display:flex;background:var(--soft);border-radius:999px;padding:4px;margin:12px 0 4px}
.seg button{flex:1;border:0;background:none;border-radius:999px;padding:9px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* ---------- week navigation ---------- */
.weeknav{display:flex;align-items:center;justify-content:space-between;margin:14px 0 4px}
.weeknav strong{font:700 17px var(--display)}
.icon-btn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0}
.icon-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- meals ---------- */
.day-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);margin-top:10px;overflow:hidden}
.day-card.today{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}
.day-card header{display:flex;justify-content:space-between;align-items:baseline;padding:12px 14px 4px}
.day-card header h3 span{font-weight:500;color:var(--muted);font-family:var(--body);font-size:15px;margin-left:6px}
.slot{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:12px 14px;min-height:54px}
.slot:first-of-type{border-top:0}
.slot b{flex:none;width:44px;font-size:14px;color:var(--muted)}
.slot .what{flex:1;min-width:0}
.slot .what.none{color:var(--muted)}

/* ---------- shopping ---------- */
.shop-item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:11px 14px;min-height:52px}
.shop-item:first-child{border-top:0}
.box{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--muted);display:grid;place-items:center}
.shop-item.done .box{background:var(--accent);border-color:var(--accent)}
.box svg{width:15px;height:15px;stroke:var(--on-accent);stroke-width:3;fill:none;opacity:0}
.shop-item.done .box svg{opacity:1}
.shop-item.done .nm{text-decoration:line-through;color:var(--muted)}
.shop-item .q{margin-left:auto;color:var(--muted);font-size:15px;white-space:nowrap}

/* ---------- balance ---------- */
.bal{display:grid;grid-template-columns:auto 1fr auto;gap:10px 12px;align-items:center;padding:14px}
.bal .bar{height:12px;border-radius:6px;background:var(--soft);overflow:hidden}
.bal .bar i{display:block;height:100%;border-radius:6px}
.bal .n{font-variant-numeric:tabular-nums;font-size:15px;color:var(--muted);min-width:5ch;text-align:right}

/* ---------- invite ---------- */
.code{font:800 40px/1 var(--display);letter-spacing:.14em;margin:6px 0 4px;font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:16px}

/* ---------- floating add ---------- */
.fab{position:fixed;right:max(16px,calc(50% - 304px));bottom:calc(var(--tabbar) + env(safe-area-inset-bottom) + 16px);z-index:6;
  display:flex;align-items:center;gap:8px;height:54px;padding:0 22px 0 18px;border-radius:999px;border:0;
  background:var(--accent);color:var(--on-accent);font:700 17px var(--body);box-shadow:0 6px 18px rgba(20,40,34,.25)}
.fab svg{width:22px;height:22px;stroke:currentColor;stroke-width:2.6;fill:none;stroke-linecap:round}

/* ---------- tab bar ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
.tabs .wrap{display:flex;padding:0 4px}
.tabs button{flex:1;height:var(--tabbar);border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-size:12px;font-weight:700;color:var(--muted)}
.tabs svg{width:24px;height:24px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--ink)}
.tabs button[aria-current="page"] svg{stroke:var(--accent);stroke-width:2.4}

/* ---------- sheet ---------- */
dialog.sheet{border:0;padding:0;margin:auto auto 0;width:100%;max-width:640px;max-height:92vh;max-height:92dvh;
  border-radius:var(--r-lg) var(--r-lg) 0 0;background:var(--bg);color:var(--ink);overflow:auto;overscroll-behavior:contain}
dialog.sheet::backdrop{background:rgba(10,20,18,.45)}
dialog.sheet[open]{animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){dialog.sheet[open]{animation:none}}
.sheet-in{padding:10px 18px calc(env(safe-area-inset-bottom) + 22px)}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sheet-h h2{margin:6px 0}
.sheet-sticky{position:sticky;bottom:0;background:var(--bg);padding-top:12px;margin-top:8px}
.rec-list{max-height:40vh;overflow:auto;margin-top:10px}
.rec{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:none;border-top:1px solid var(--line);padding:10px 4px}
.rec:first-child{border-top:0}
.rec img,.rec .ph{width:44px;height:44px;border-radius:10px;object-fit:cover;flex:none;background:var(--soft)}
.rec[aria-pressed="true"]{background:var(--soft);border-radius:10px}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:calc(var(--tabbar) + env(safe-area-inset-bottom) + 84px);transform:translateX(-50%);z-index:30;
  background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 14px 12px 18px;display:flex;gap:14px;align-items:center;
  max-width:min(92vw,520px);font-size:15px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast button{background:none;border:0;color:inherit;font-weight:700;text-decoration:underline;padding:4px}

/* ---------- messages ---------- */
main.wrap.view-messages{padding-bottom:calc(var(--tabbar) + env(safe-area-inset-bottom) + 96px)}
.msgs{display:flex;flex-direction:column;gap:3px}
.msg-day{align-self:center;font-size:13px;font-weight:700;color:var(--muted);margin:16px 0 6px}
.msg{display:flex;align-items:flex-end;gap:8px;max-width:86%}
.msg.first{margin-top:8px}
.msg.mine{align-self:flex-end;flex-direction:row-reverse}
.av-gap{width:22px;flex:none}
.bubble{--c:var(--muted);background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c);
  border-radius:4px 16px 16px 4px;padding:8px 12px 6px;min-width:64px}
.msg.mine .bubble{background:var(--accent);color:var(--on-accent);border:0;border-radius:16px 16px 4px 16px;cursor:pointer}
.bubble .from{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:1px}
.bubble .txt{display:block;white-space:pre-wrap;overflow-wrap:anywhere}
.bubble .at{display:block;text-align:right;font-size:11.5px;opacity:.7;margin-top:2px;font-variant-numeric:tabular-nums}
.composer{position:fixed;left:0;right:0;bottom:calc(var(--tabbar) + env(safe-area-inset-bottom));z-index:6;
  background:var(--bg);border-top:1px solid var(--line);padding:8px 0}
.composer textarea.input{min-height:46px;max-height:140px;resize:none;border-radius:23px;padding:11px 16px;line-height:1.3}
.send{flex:none;width:46px;height:46px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}
.send svg{width:22px;height:22px;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linejoin:round;stroke-linecap:round}
.tabs button{position:relative}
.badge{position:absolute;top:8px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;
  background:var(--late);color:#fff;font:700 11px/18px var(--body);font-style:normal;text-align:center}

/* ---------- map ---------- */
.map{height:min(52vh,420px);border-radius:var(--r-md);overflow:hidden;border:1px solid var(--line);background:var(--soft);z-index:0}
.pin{background:none;border:0}
.pin .av{box-shadow:0 0 0 3px #fff,0 3px 10px rgba(0,0,0,.3)}
.leaflet-popup-content{font:15px/1.35 var(--body)}
.icon-btn.plain{border-color:transparent;background:none}
.icon-btn.plain.on{color:var(--accent)}
.row:disabled{opacity:1;color:inherit;cursor:default}

/* ---------- welcome ---------- */
.welcome{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:flex-end;
  padding-top:calc(env(safe-area-inset-top) + 32px);padding-bottom:calc(env(safe-area-inset-bottom) + 28px)}
.welcome h1{font:800 clamp(46px,13vw,68px)/.95 var(--display);letter-spacing:-.04em;margin:0 0 14px}
.welcome .lead{font-size:19px;max-width:30ch;margin-bottom:26px}
.dots{display:flex;gap:6px;margin-bottom:22px}
.dots i{width:30px;height:12px;border-radius:4px}
.err{color:var(--danger);font-weight:700;margin-top:12px}
</style>
</head>
<body>
<div id="app"></div>
<dialog class="sheet" id="sheet" aria-labelledby="sheetTitle"><div class="sheet-in" id="sheetIn"></div></dialog>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script src="app.js"></script>
</body>
</html>
