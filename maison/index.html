<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maisonnée</title>
<meta name="description" content="Les tâches, l'agenda et les repas de la maison, partagés entre vous.">
<meta name="theme-color" content="#F1F4F9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121926" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Maisonnée">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#F1F4F9; --surface:#FFFFFF; --soft:#E8EDF5; --line:#DCE3EE;
  --ink:#172033; --muted:#5D6A80; --accent:#2F6FE4; --on-accent:#FFFFFF;
  --danger:#C8402F; --late:#D9483A; --hot:#E0703A;
  --r-sm:12px; --r-md:20px; --r-lg:26px;
  --display:-apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", system-ui, sans-serif;
  --body:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  --tabbar:64px; --navspace:96px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#121926; --surface:#1B2433; --soft:#232E40; --line:#2B374B;
    --ink:#EEF2F8; --muted:#8F9BB0; --accent:#4C8DF6; --on-accent:#FFFFFF;
    --danger:#FF8576; --late:#FF7A6B; --hot:#FFA36B; color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
/* the page never slides sideways: nothing may stick out, and horizontal swipes only scroll the rows made for it */
html,body{width:100%;overflow-x:clip;overscroll-behavior-x:none;max-width:100%}
#app,main,.wrap{min-width:0;max-width:100%}
.inline>*{min-width:0}
body{touch-action:pan-y pinch-zoom}
.who,.rec-list{touch-action:pan-x pan-y pinch-zoom;overscroll-behavior-x:contain}
.map,.lb-img{touch-action:none}
img{max-width:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 var(--body);
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:5;background:var(--bg);
  padding:calc(env(safe-area-inset-top) + 10px) 0 8px}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px}
.hh-name{font:700 17px/1.2 var(--display);letter-spacing:-.01em;background:none;border:0;padding:6px 0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60%}
.stack{display:flex;background:none;border:0;padding:4px}
.stack .av{margin-left:-8px;box-shadow:0 0 0 2px var(--bg)}
.stack .av:first-child{margin-left:0}
.sync{font-size:13px;color:var(--muted)}

main.wrap{padding-bottom:calc(var(--navspace) + env(safe-area-inset-bottom) + 76px)}

/* ---------- headings ---------- */
h1.day{font:800 clamp(34px,9vw,44px)/1.02 var(--display);letter-spacing:-.03em;margin:8px 0 6px}
h2{font:700 21px/1.2 var(--display);letter-spacing:-.015em;margin:28px 0 10px}
h3{font:700 17px/1.25 var(--display);margin:0}
.muted{color:var(--muted)}
.small{font-size:14px}
p{margin:0 0 10px}

/* ---------- the day ribbon: one segment per task, filled with the colour of whoever did it ---------- */
.ribbon{display:flex;gap:4px;height:14px;margin:14px 0 6px}
.ribbon i{flex:1;border-radius:4px;background:var(--soft);border:1px solid var(--line)}
.ribbon i.done{border-color:transparent}
.ribbon-cap{font-size:15px;color:var(--muted);margin:0}

/* ---------- avatars ---------- */
.av{--c:var(--accent);width:30px;height:30px;border-radius:50%;flex:none;display:inline-grid;place-items:center;
  background:var(--c);color:#fff;font:700 14px/1 var(--display);text-transform:uppercase}
.av.lg{width:40px;height:40px;font-size:17px}
.av.sm{width:22px;height:22px;font-size:11px}
.av.any{background:transparent;color:var(--muted);border:2px dashed var(--line)}

/* ---------- member filter ---------- */
.who{display:flex;gap:8px;overflow-x:auto;padding:4px 0 2px;margin:14px -16px 0;padding-inline:16px;scrollbar-width:none}
.who::-webkit-scrollbar{display:none}
.who button{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);
  border-radius:999px;padding:4px 12px 4px 4px;white-space:nowrap;font-size:15px}
.who button.plain{padding:7px 14px}
.who button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* ---------- lists ---------- */
.list{background:var(--surface);border-radius:var(--r-md);border:1px solid var(--line);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);min-height:58px;
  background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.row:first-child{border-top:0}
.ev-row{padding-right:6px}
.row.ev-row button.open{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
.bell-btn{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:none;font-size:20px;opacity:.28;filter:grayscale(1);display:grid;place-items:center}
.bell-btn.on{opacity:1;filter:none}
.row .main{flex:1;min-width:0}
.row .t{display:block;font-weight:700;overflow-wrap:anywhere}
.row .m{display:block;font-size:14px;color:var(--muted);margin-top:1px}
.row .m .late{color:var(--late);font-weight:700}
.row.is-done .t{text-decoration:line-through;text-decoration-thickness:2px;color:var(--muted)}
.row button.open{all:unset;flex:1;min-width:0;cursor:pointer}
.row button.open:focus-visible{outline:3px solid var(--accent);outline-offset:4px;border-radius:4px}
.group-h{font:700 15px/1.2 var(--body);color:var(--muted);margin:22px 4px 8px}
.group-h.late{color:var(--late)}

/* the check: a ring in the assignee's colour that fills when done */
.check{--c:var(--ink);flex:none;width:34px;height:34px;border-radius:50%;border:2.5px solid var(--c);
  background:transparent;display:grid;place-items:center;padding:0;transition:background .18s}
.check svg{width:18px;height:18px;stroke:#fff;stroke-width:3;fill:none;stroke-dasharray:24;stroke-dashoffset:24}
.check.on{background:var(--c)}
.check.on svg{stroke-dashoffset:0;transition:stroke-dashoffset .25s .08s ease-out}
.check.any{--c:var(--muted);border-style:dashed}
.check.any.on{border-style:solid}
@media (prefers-reduced-motion: reduce){.check,.check svg{transition:none!important}}

.tag{display:inline-flex;align-items:center;gap:5px}
.tag .av{vertical-align:middle}

/* ---------- cards on today ---------- */
.meal-line{display:grid;grid-template-columns:56px 1fr;gap:10px;align-items:baseline}
.meal-line b{font:700 14px var(--body);color:var(--muted)}
.ev-time{flex:none;width:64px;white-space:nowrap;font:700 15px/1.2 var(--display);font-variant-numeric:tabular-nums}
.ev-time.allday{font-size:13px;color:var(--muted);font-family:var(--body)}

/* ---------- empty states ---------- */
.empty{padding:22px 18px;text-align:left;border:1.5px dashed var(--line);border-radius:var(--r-md);color:var(--muted)}
.empty strong{display:block;color:var(--ink);font:700 17px var(--display);margin-bottom:4px}
.empty .btn{margin-top:12px}

/* ---------- buttons, chips, fields ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 18px;
  border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:700}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.ink{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.danger{color:var(--danger)}
.btn.block{width:100%}
.btn.ghost{background:none;border-color:transparent;padding-inline:10px}
.btn:disabled{opacity:.5}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.linkbtn{background:none;border:0;padding:6px 0;color:var(--accent);font-weight:700;text-decoration:underline;text-underline-offset:3px}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:15px;
  display:inline-flex;align-items:center;gap:6px;min-height:38px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .av{margin-left:-6px}

.field{display:block;margin:16px 0 0}
.field>.label{display:block;font-weight:700;font-size:15px;margin-bottom:6px}
.input,select.input,textarea.input{width:100%;min-height:48px;padding:11px 14px;border-radius:var(--r-sm);
  border:1px solid var(--line);background:var(--surface);font-size:17px}
textarea.input{min-height:84px;resize:vertical}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.inline{display:flex;gap:8px;align-items:center}
.inline .input{flex:1}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px}
.switch input{width:46px;height:28px;appearance:none;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .15s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{transform:translateX(18px)}

/* ---------- segmented control ---------- */
.seg{display:flex;background:var(--soft);border-radius:999px;padding:4px;margin:12px 0 4px}
.seg button{flex:1;border:0;background:none;border-radius:999px;padding:9px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* ---------- week navigation ---------- */
.weeknav{display:flex;align-items:center;justify-content:space-between;margin:14px 0 4px}
.weeknav strong{font:700 17px var(--display)}
.icon-btn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0}
.icon-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- meals ---------- */
.day-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);margin-top:10px;overflow:hidden}
.day-card.today{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}
.day-card header{display:flex;justify-content:space-between;align-items:baseline;padding:12px 14px 4px}
.day-card header h3 span{font-weight:500;color:var(--muted);font-family:var(--body);font-size:15px;margin-left:6px}
.slot{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:12px 14px;min-height:54px}
.slot:first-of-type{border-top:0}
.slot b{flex:none;width:44px;font-size:14px;color:var(--muted)}
.slot .what{flex:1;min-width:0}
.slot .what.none{color:var(--muted)}
.slot .keep{flex:none;border:1px solid var(--line);background:none;color:var(--muted);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:700;white-space:nowrap}
.slot .keep.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.slot .keep.shop{border-color:transparent}

/* ---------- shopping ---------- */
.shop-item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:11px 14px;min-height:52px}
.shop-item:first-child{border-top:0}
.box{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--muted);display:grid;place-items:center}
.shop-item.done .box{background:var(--accent);border-color:var(--accent)}
.box svg{width:15px;height:15px;stroke:var(--on-accent);stroke-width:3;fill:none;opacity:0}
.shop-item.done .box svg{opacity:1}
.shop-item.done .nm{text-decoration:line-through;color:var(--muted)}
.cx-item{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);padding:9px 12px;min-height:52px}
.cx-item:first-child{border-top:0}
.cx-item .nm{flex:1;min-width:0}
.cx-item .q{color:var(--muted);font-size:15px;white-space:nowrap}
.cx-tick{flex:none;background:none;border:0;padding:6px;margin:-6px}
.cx-item.done .box{background:var(--accent);border-color:var(--accent)}
.cx-item.done .box svg{opacity:1}
.cx-item.done .nm{text-decoration:line-through;color:var(--muted)}
.cx-from,.cx-miss{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.cx-miss{color:var(--warn,#e8a33d)}
.cx-have{flex:none;border:1px solid var(--line);background:none;color:var(--muted);border-radius:999px;padding:5px 10px;font-size:13px;font-weight:700;white-space:nowrap}
.cx-have.on{color:var(--accent);border-color:var(--accent)}
.cx-x{flex:none;border:0;background:none;color:var(--muted);font-size:16px;padding:6px}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:10px}
.cat-tile{position:relative;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-md);min-height:116px}
.cat-tile.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.cat-main{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;width:100%;height:100%;padding:30px 6px 10px;text-align:center}
.cat-em{font-size:32px;line-height:1}
.cat-nm{font-size:13px;font-weight:600;line-height:1.2;overflow-wrap:anywhere}
.cat-fq{font-size:11px;color:var(--muted)}
.cat-ok{position:absolute;top:6px;left:8px;width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-size:12px;display:grid;place-items:center}
.cat-star,.cat-more{position:absolute;top:2px;width:30px;height:30px;border:0;background:none;color:var(--muted);font-size:17px;padding:0}
.cat-star{right:26px}.cat-more{right:0;font-weight:800}
.cat-star.on{color:#F5B400}
.cx-name{all:unset;cursor:pointer;overflow-wrap:anywhere}
.cx-rayon{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.cx-rayon .linkbtn{margin-right:4px}
.ing-item.on .box{background:var(--accent);border-color:var(--accent)}
.ing-item.on .box svg{opacity:1}
.ing-item:not(.on) .nm{text-decoration:line-through;color:var(--muted)}
.shop-item .q{margin-left:auto;color:var(--muted);font-size:15px;white-space:nowrap}

/* ---------- balance ---------- */
.bal{display:grid;grid-template-columns:auto 1fr auto;gap:10px 12px;align-items:center;padding:14px}
.bal .bar{height:12px;border-radius:6px;background:var(--soft);overflow:hidden}
.bal .bar i{display:block;height:100%;border-radius:6px}
.bal .n{font-variant-numeric:tabular-nums;font-size:15px;color:var(--muted);min-width:5ch;text-align:right}

/* ---------- invite ---------- */
.code{font:800 40px/1 var(--display);letter-spacing:.14em;margin:6px 0 4px;font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:16px}

/* ---------- floating add ---------- */
.fab{position:fixed;right:max(16px,calc(50% - 304px));bottom:calc(var(--navspace) + env(safe-area-inset-bottom) + 4px);z-index:6;
  display:flex;align-items:center;gap:8px;height:54px;padding:0 22px 0 18px;border-radius:999px;border:0;
  background:var(--accent);color:var(--on-accent);font:700 17px var(--body);box-shadow:0 6px 18px rgba(20,40,34,.25)}
.fab svg{width:22px;height:22px;stroke:currentColor;stroke-width:2.6;fill:none;stroke-linecap:round}

/* ---------- tab bar ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
.tabs .wrap{display:flex;padding:0 4px}
.tabs button{flex:1;height:var(--tabbar);border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-size:12px;font-weight:700;color:var(--muted)}
.tabs svg{width:24px;height:24px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--ink)}
.tabs button[aria-current="page"] svg{stroke:var(--accent);stroke-width:2.4}

/* ---------- sheet ---------- */
dialog.sheet{border:0;padding:0;margin:auto auto 0;width:100%;max-width:640px;max-height:92vh;max-height:92dvh;
  border-radius:var(--r-lg) var(--r-lg) 0 0;background:var(--bg);color:var(--ink);overflow:auto;overscroll-behavior:contain}
dialog.sheet:focus-within{scroll-padding-bottom:100px}
dialog.sheet input,dialog.sheet textarea{scroll-margin-bottom:110px}
dialog.sheet{height:auto;max-height:calc(100dvh - env(safe-area-inset-top) - 12px);overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;touch-action:pan-y;scroll-behavior:auto;overflow-anchor:none}
dialog.sheet .sheet-in{min-width:0;overflow-x:clip}
dialog.sheet .sheet-sticky{z-index:2}
@supports(height:100svh){dialog.sheet{max-height:calc(100svh - env(safe-area-inset-top) - 12px)}}
dialog.sheet::backdrop{background:rgba(10,20,18,.45)}
dialog.sheet[open]{animation:none}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){dialog.sheet[open]{animation:none}}
.sheet-in{padding:10px 18px calc(env(safe-area-inset-bottom) + 22px)}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sheet-h h2{margin:6px 0}
.sheet-sticky{position:sticky;bottom:0;background:var(--bg);padding-top:12px;margin-top:8px}
.rec-list{max-height:40vh;overflow:auto;margin-top:10px}
.rec{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:none;border-top:1px solid var(--line);padding:10px 4px}
.rec:first-child{border-top:0}
.rec img,.rec .ph{width:44px;height:44px;border-radius:10px;object-fit:cover;flex:none;background:var(--soft)}
.rec[aria-pressed="true"]{background:var(--soft);border-radius:10px}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:calc(var(--navspace) + env(safe-area-inset-bottom) + 72px);transform:translateX(-50%);z-index:30;
  background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 14px 12px 18px;display:flex;gap:14px;align-items:center;
  max-width:min(92vw,520px);font-size:15px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast button{background:none;border:0;color:inherit;font-weight:700;text-decoration:underline;padding:4px}

/* ---------- messages ---------- */
main.wrap.view-messages{padding-bottom:calc(var(--navspace) + env(safe-area-inset-bottom) + 80px)}
.msgs{display:flex;flex-direction:column;gap:3px}
.msg-day{align-self:center;font-size:13px;font-weight:700;color:var(--muted);margin:16px 0 6px}
.msg{display:flex;align-items:flex-end;gap:8px;max-width:86%}
.msg.first{margin-top:8px}
.msg.mine{align-self:flex-end;flex-direction:row-reverse}
.av-gap{width:22px;flex:none}
.bubble{--c:var(--muted);background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c);
  border-radius:4px 16px 16px 4px;padding:8px 12px 6px;min-width:64px}
.msg.mine .bubble{background:var(--accent);color:var(--on-accent);border:0;border-radius:16px 16px 4px 16px;cursor:pointer}
.bubble .from{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:1px}
.bubble .txt{display:block;white-space:pre-wrap;overflow-wrap:anywhere}
.bubble .at{display:block;text-align:right;font-size:11.5px;opacity:.7;margin-top:2px;font-variant-numeric:tabular-nums}
.composer{position:fixed;left:0;right:0;bottom:calc(var(--navspace) + env(safe-area-inset-bottom) - 8px);z-index:6;
  background:var(--bg);border-top:1px solid var(--line);padding:8px 0}
.composer textarea.input{min-height:46px;max-height:140px;resize:none;border-radius:23px;padding:11px 16px;line-height:1.3}
.send{flex:none;width:46px;height:46px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}
.send svg{width:22px;height:22px;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linejoin:round;stroke-linecap:round}
.tabs button{position:relative}
.badge{position:absolute;top:8px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;
  background:var(--late);color:#fff;font:700 11px/18px var(--body);font-style:normal;text-align:center}

/* ---------- map ---------- */
.map{height:min(52vh,420px);border-radius:var(--r-md);overflow:hidden;border:1px solid var(--line);background:var(--soft);z-index:0}
.pin{background:none;border:0}
.pin .av{box-shadow:0 0 0 3px #fff,0 3px 10px rgba(0,0,0,.3)}
.leaflet-popup-content{font:15px/1.35 var(--body)}
.icon-btn.plain{border-color:transparent;background:none}
.icon-btn.plain.on{color:var(--accent)}
.row:disabled{opacity:1;color:inherit;cursor:default}

/* ---------- FamilyWall-like shell: module tiles, floating nav ---------- */
.mi{--mc:#888;display:inline-grid;place-items:center;flex:none}
.mi svg{width:44px;height:44px;stroke:var(--mc);stroke-width:2.3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.mi .f{fill:color-mix(in srgb,var(--mc) 26%,transparent)}
.mi .s{fill:var(--mc);stroke:none}
.mi.sm svg{width:26px;height:26px;stroke-width:2.6}
.mi.xs svg{width:22px;height:22px;stroke-width:2.6}
.top .title{font:700 21px/1.2 var(--display);margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn.back{margin-left:-10px}
.hello{margin:6px 0 0;color:var(--muted);font-weight:600}
h1.day{font-family:var(--display);font-weight:800}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}
.tile{position:relative;display:flex;flex-direction:column;align-items:flex-start;text-align:left;min-height:150px;padding:16px 16px 14px;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
.tile-t{font:700 19px/1.2 var(--display);letter-spacing:-.01em}
.tile-s{color:var(--muted);font-size:14.5px;line-height:1.3;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;padding-right:4px}
.tile .mi{margin-top:auto;align-self:flex-end}
.tile .mi svg{width:52px;height:52px}
.tile-badge{top:12px;right:12px;left:auto}
.tile:active,.sq:active{transform:scale(.98)}
.sq-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 8px}
.sq{background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.sq-ic{position:relative;width:72px;height:72px;border-radius:22px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center}
.sq-ic .mi svg{width:42px;height:42px}
.sq-t{font-size:14px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pin-mark{position:absolute;top:-7px;right:-7px;width:26px;height:26px;border-radius:50%;background:var(--soft);border:2px solid var(--bg);display:grid;place-items:center;font-style:normal}
.pin-mark svg{width:14px;height:14px;stroke:var(--ink);stroke-width:3;fill:none;stroke-linecap:round}
.sq[aria-pressed="true"] .pin-mark{background:var(--accent)}
.sq[aria-pressed="true"] .pin-mark svg{stroke:#fff}
.sq[aria-pressed="false"] .sq-ic{opacity:.55}
.pill{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 14px);z-index:7;
  display:flex;gap:4px;padding:6px;border-radius:999px;background:color-mix(in srgb,var(--surface) 92%,transparent);border:1px solid var(--line);
  box-shadow:0 10px 30px rgba(5,10,20,.28);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.pill button{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;border-radius:999px;
  padding:8px 18px 6px;font-size:11.5px;font-weight:700;color:var(--muted);min-width:76px}
.pill svg{width:24px;height:24px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.pill button[aria-current="page"]{color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
.pill .badge{top:3px;left:calc(50% + 6px)}
.row.more{justify-content:center;color:var(--accent);font-weight:700;min-height:48px}

/* calendar */
.cal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:8px 8px 10px;margin-top:4px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal-h{font-size:13px;color:var(--muted);font-weight:700;padding:4px 0}
.cal-d{position:relative;border:0;background:none;height:42px;border-radius:12px;font-size:17px;font-variant-numeric:tabular-nums}
.cal-d.out{color:var(--muted);opacity:.6}
.cal-d.now{color:var(--accent);font-weight:800}
.cal-d[aria-pressed="true"]{background:var(--accent);color:#fff;font-weight:700}
.cal-d i{position:absolute;left:50%;bottom:4px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:#3DB972}
.cal-d[aria-pressed="true"] i{background:#fff}
.day-band{display:flex;align-items:center;justify-content:space-between;margin:18px -16px 6px;padding:2px 6px 2px 16px;background:var(--soft);font-weight:700;font-size:15px}
.none-day{color:var(--muted);text-align:center;margin:10px 0 4px}
.list.flat .row{min-height:54px}

/* modules */
.datebox{--mc:#888;flex:none;width:48px;height:52px;border-radius:14px;background:color-mix(in srgb,var(--mc) 22%,transparent);color:var(--mc);
  display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.datebox b{font-size:20px}
.datebox span{font-size:12px;font-weight:700;margin-top:3px}
.hot{color:var(--hot);font-weight:700}
.thumb{width:48px;height:48px;border-radius:12px;object-fit:cover;flex:none;background:var(--soft);display:grid;place-items:center}
.ing{list-style:none;padding:0;margin:8px 0 0}
.ing li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.steps{padding-left:22px;margin:8px 0 0}
.steps li{margin-bottom:8px}
.cat-dot{--c:#888;width:12px;height:12px;border-radius:50%;background:var(--c);flex:none}
.amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.amt.in{color:#3DB972}
.bud-card{display:flex;flex-direction:column;align-items:flex-start}
.bud-big{font:800 38px/1.1 var(--display);letter-spacing:-.02em;margin:2px 0 10px;font-variant-numeric:tabular-nums}
.meter{width:100%;height:10px;border-radius:5px;background:var(--soft);overflow:hidden;margin-bottom:6px}
.meter i{display:block;height:100%;border-radius:5px}
.bal .bar{display:block;margin-top:4px}
.filebox{flex:none;width:46px;height:46px;border-radius:12px;background:color-mix(in srgb,#6A86F0 22%,transparent);color:#6A86F0;display:grid;place-items:center;font-size:11.5px;font-weight:800}
.card.warn{border-color:color-mix(in srgb,var(--hot) 60%,transparent);display:flex;flex-direction:column;gap:2px}
.card.warn strong{color:var(--hot)}
.now-card{display:flex;flex-direction:column;border-color:color-mix(in srgb,#E46CA6 55%,transparent)}
.seg.days button{padding:9px 2px;font-size:14px}
.card{border-radius:var(--r-md)}
.list{border-radius:var(--r-md)}

/* gallery */
.ph-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;border-radius:14px;overflow:hidden}
.ph{border:0;padding:0;aspect-ratio:1;background:var(--soft);overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.lb{position:fixed;inset:0;z-index:40;background:#05080d;color:#fff;display:flex;flex-direction:column}
.lb-top{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 6px) 10px 6px;font-weight:700}
.lb-top .icon-btn{color:#fff;font-size:20px}
.lb-img{flex:1;min-height:0;display:grid;place-items:center}
.lb-img img{max-width:100%;max-height:100%;object-fit:contain}
.lb-info{padding:12px 16px calc(env(safe-area-inset-bottom) + 14px);background:linear-gradient(transparent,rgba(0,0,0,.6))}
.lb-info .btn{background:rgba(255,255,255,.12);border-color:transparent;color:#fff}
.lb-info .btn.danger{color:#FF8576}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:64px;border:0;background:rgba(255,255,255,.08);color:#fff;display:grid;place-items:center}
.lb-nav svg{width:24px;height:24px;stroke:currentColor;stroke-width:2.4;fill:none}
.lb-nav.prev{left:0;border-radius:0 12px 12px 0}.lb-nav.next{right:0;border-radius:12px 0 0 12px}
@media (hover:none){.lb-nav{display:none}}

/* links with the Carnet, Google events, addresses */
a.btn{text-decoration:none;color:inherit}
a.btn.primary{color:var(--on-accent)}
.linkcard{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:6px;font-size:14.5px;color:var(--muted)}
.linkcard .linkbtn{flex:none;white-space:nowrap}
.who-tag{--c:#888;display:inline-flex;align-items:center;gap:5px;font-weight:700;color:var(--ink)}
.who-tag::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c)}
.gbar{flex:none;width:4px;align-self:stretch;border-radius:2px;margin:2px 0}
.addr{color:var(--ink);font-weight:600}

/* ---------- welcome ---------- */
.welcome{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:flex-end;
  padding-top:calc(env(safe-area-inset-top) + 32px);padding-bottom:calc(env(safe-area-inset-bottom) + 28px)}
.welcome h1{font:800 clamp(46px,13vw,68px)/.95 var(--display);letter-spacing:-.04em;margin:0 0 14px}
.welcome .lead{font-size:19px;max-width:30ch;margin-bottom:26px}
.dots{display:flex;gap:6px;margin-bottom:22px}
.dots i{width:30px;height:12px;border-radius:4px}
.err{color:var(--danger);font-weight:700;margin-top:12px}
/* === Maisonnée · Design C V2 : verre 3D lumineux / fond nuit === */
:root {
  --bg:#090f21; --surface:#14233c; --soft:#1b3050; --line:#365578;
  --ink:#f3f8ff; --muted:#b0c5e2; --accent:#54a9ff; --on-accent:#06172c;
  --danger:#ff8f91; --late:#ff857e; --hot:#ffae77;
  color-scheme:dark;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#090f21; --surface:#14233c; --soft:#1b3050; --line:#365578;
  --ink:#f3f8ff; --muted:#b0c5e2; --accent:#54a9ff; --on-accent:#06172c;
  --danger:#ff8f91; --late:#ff857e; --hot:#ffae77;color-scheme:dark;
}}
html{background:#090f21}
body{
  background:radial-gradient(ellipse 95% 44% at 50% -12%,rgba(32,125,240,.27),transparent 78%),
    radial-gradient(ellipse 65% 35% at 105% 72%,rgba(23,85,187,.14),transparent 80%),#090f21;
  background-attachment:fixed;
}
.top{background:rgba(9,15,33,.93);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid rgba(108,183,255,.16)}
.tile,.sq,.list,.day-card,.empty,.card,.seg,.sheet-in{
  background:linear-gradient(150deg,rgba(38,66,106,.94),rgba(15,28,52,.97) 70%);
  border-color:rgba(109,178,255,.42);
  box-shadow:inset 0 1px 0 rgba(205,232,255,.20),inset 0 -8px 18px rgba(3,12,30,.20),
    0 7px 22px rgba(0,0,0,.30),0 0 15px rgba(48,146,255,.15);
}
.tile,.sq{position:relative;overflow:hidden;
  box-shadow:inset 0 1px 0 rgba(220,241,255,.30),inset 0 -10px 18px rgba(3,12,30,.27),
    0 9px 23px rgba(0,0,0,.34),0 0 19px rgba(48,157,255,.34),0 0 3px rgba(101,193,255,.64);
  transition:box-shadow .2s ease,transform .2s ease,border-color .2s ease}
.tile::before,.sq::before{content:"";position:absolute;inset:0 0 auto;height:44%;pointer-events:none;
  background:linear-gradient(180deg,rgba(216,239,255,.14),transparent);border-radius:inherit}
.tile:active,.sq:active{transform:translateY(1px) scale(.99)}
.tile:focus-visible,.sq:focus-visible{box-shadow:0 0 0 2px #a3e4ff,0 0 24px #398fff}
.mi{filter:drop-shadow(0 0 9px rgba(95,188,255,.70))}
.btn,.icon-btn,.chip,.seg button[aria-pressed="true"]{
  background:linear-gradient(160deg,#284b7b,#142a4c 72%);border-color:rgba(128,198,255,.55);
  box-shadow:inset 0 1px 0 rgba(228,244,255,.28),0 4px 14px rgba(0,0,0,.25),0 0 12px rgba(50,150,255,.24)}
.btn.primary,.fab{background:linear-gradient(145deg,#9be1ff,#4ba7ff 48%,#2268d2);color:#06172c;
  border:1px solid #a7e9ff;box-shadow:inset 0 2px 0 rgba(255,255,255,.55),0 6px 18px rgba(0,0,0,.36),0 0 20px rgba(53,158,255,.75)}
.input,select.input,textarea.input{background:#101e35;color:var(--ink);border-color:#47668b}
.input::placeholder{color:#9db4d2}
/* === Design C V2 · intensité lumineuse restaurée (CSS uniquement) === */
.tile,.sq{
  border-color:rgba(137,218,255,.88);
  background:linear-gradient(155deg,rgba(51,100,164,.98) 0%,rgba(24,55,103,.98) 48%,rgba(9,23,52,.99) 100%);
  box-shadow:inset 0 2px 1px rgba(240,251,255,.52),inset 0 -13px 22px rgba(0,8,31,.42),
    inset 2px 0 13px rgba(86,174,255,.20),0 11px 25px rgba(0,0,0,.45),
    0 0 9px rgba(90,202,255,.90),0 0 25px rgba(43,149,255,.78),0 0 47px rgba(19,106,255,.40);
}
.tile::before,.sq::before{
  background:linear-gradient(180deg,rgba(235,249,255,.32),rgba(135,209,255,.11) 47%,transparent);
}
.tile .mi,.sq .mi{filter:drop-shadow(0 0 6px rgba(182,236,255,.95)) drop-shadow(0 0 15px rgba(42,163,255,.85))}
.btn,.icon-btn,.chip,.seg button[aria-pressed="true"]{
  border-color:rgba(151,222,255,.85);
  box-shadow:inset 0 2px 1px rgba(232,249,255,.42),inset 0 -6px 12px rgba(2,13,37,.33),
    0 6px 16px rgba(0,0,0,.37),0 0 9px rgba(108,209,255,.82),0 0 23px rgba(44,146,255,.59);
}
.btn.primary,.fab{
  box-shadow:inset 0 2px 1px rgba(255,255,255,.78),inset 0 -6px 12px rgba(12,77,172,.30),
    0 7px 20px rgba(0,0,0,.42),0 0 10px rgba(173,236,255,.96),
    0 0 28px rgba(48,166,255,.90),0 0 49px rgba(35,126,255,.48);
}
@media (hover:hover){
  .tile:hover,.sq:hover{border-color:#b8efff;box-shadow:inset 0 2px 1px rgba(255,255,255,.60),
    inset 0 -13px 22px rgba(0,8,31,.42),0 12px 26px rgba(0,0,0,.45),
    0 0 12px rgba(130,224,255,.98),0 0 33px rgba(50,167,255,.90),0 0 56px rgba(19,106,255,.50)}
}
.tile:active,.sq:active{filter:brightness(1.15)}
/* iPhone : la fenêtre de saisie suit la hauteur réellement visible avec le clavier.
   Appliqué à tous les formulaires ouverts dans Maisonnée. */
html,body{overscroll-behavior-y:auto}
dialog.sheet{
  max-height:calc(var(--maison-vh, 100dvh) - 12px) !important;
  overflow-y:auto !important;
  overflow-x:hidden !important;
  overscroll-behavior-y:contain;
  -webkit-overflow-scrolling:touch;
  touch-action:pan-y;
  scroll-padding-bottom:110px;
}
dialog.sheet .sheet-in{padding-bottom:max(28px, env(safe-area-inset-bottom))}
dialog.sheet input,dialog.sheet textarea,dialog.sheet select{scroll-margin-bottom:125px}
/* Les boutons de validation restent accessibles sans bloquer le défilement. */
dialog.sheet .sheet-sticky{position:relative;bottom:auto}
/* Keep the underlying agenda frozen while any modal is open. */
body.maison-sheet-open{overflow:hidden!important;overscroll-behavior:none}
body.maison-sheet-open #app{touch-action:none}
dialog.sheet{overscroll-behavior:contain;touch-action:pan-y;}
dialog.sheet .sheet-in{touch-action:pan-y}
/* Quand le clavier est ouvert, la feuille occupe seulement la zone visible. */
dialog.sheet.maison-keyboard{position:fixed;bottom:auto!important;margin:0 auto!important;left:0;right:0;overflow-y:auto!important;border-radius:var(--r-lg) var(--r-lg) 0 0}
/* Évite le zoom automatique d'iOS qui décale les champs. */
@media (max-width:767px){dialog.sheet input,dialog.sheet textarea,dialog.sheet select{font-size:max(16px,1em)}}


/* iPhone: date and time fields keep inside their column (Safari gives them a wide built-in size) */
input[type=date].input,input[type=time].input{display:block;min-width:0;width:100%;max-width:100%;-webkit-appearance:none;appearance:none;text-align:left}
input[type=date].input::-webkit-date-and-time-value,input[type=time].input::-webkit-date-and-time-value{text-align:left}
.inline>.field{min-width:0}

/* ---------- tablette en paysage / grand écran : on profite de toute la largeur ---------- */
@media (orientation: landscape) and (min-width: 900px) and (min-height: 480px){
  .wrap{max-width:1180px;padding:0 28px}
  .fab{right:max(28px,calc(50% - 562px))}
  dialog.sheet{max-width:720px}
  /* accueil : la journée à gauche, les modules à droite */
  main.view-home{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:0 32px;align-items:start}
  main.view-home .home-side .tiles{margin-top:14px}
  .tiles{grid-template-columns:repeat(3,1fr)}
  .tile{min-height:140px}
  .sq-grid{grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}
  .msg{max-width:min(70%,620px)}
}
/* choix sélectionné bien visible : bleu vif avec ✓ (toutes les puces de Maisonnée) */
.chip[aria-pressed="true"]{background:linear-gradient(145deg,#9be1ff,#4ba7ff 48%,#2268d2)!important;color:#06172c!important;border-color:#c4efff!important;font-weight:800;
  box-shadow:inset 0 2px 1px rgba(255,255,255,.6),0 0 0 2px rgba(120,200,255,.35),0 0 16px rgba(53,158,255,.8)!important}
.chip[aria-pressed="true"]::before{content:"✓ ";font-weight:900}
.chip[aria-pressed="false"]{opacity:.82}
/* Repas : état de chaque repas (proposé, gardé, dans les courses) */
.r-legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:12px 2px 0;font-size:13px;color:var(--muted)}
.r-legend span{display:inline-flex;align-items:center;gap:6px}
.r-st{font-style:normal;font-weight:800;font-size:12px;padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--ink)}
.r-st.kept{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.r-st.shop{background:#1f7a45;border-color:#57d68b;color:#fff}
.slot .keep.shop{background:#1f7a45;border-color:#57d68b;color:#fff}
.slot .keep.left{border-color:#e6a75a;background:rgba(160,96,30,.3)}
.r-status{display:flex;flex-direction:column;gap:3px;margin-top:12px;padding:12px 14px;border-radius:16px;border:1px solid var(--line);font-size:14.5px}
.r-status b{font-size:16.5px}
.r-status span{color:var(--muted)}
.r-status.kept{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
.r-status.shop{border-color:#57d68b;background:rgba(31,122,69,.25)}
.r-status.prop{border-style:dashed}
/* Courses : accès direct à la liste */
.cx-jump{display:flex;align-items:center;gap:10px;width:100%;margin:4px 0 14px;padding:14px 16px;border-radius:18px;text-align:left;font:800 18px/1.2 var(--body);color:#06172c;
  border:1px solid #a7e9ff;background:linear-gradient(145deg,#9be1ff,#4ba7ff 48%,#2268d2);box-shadow:inset 0 2px 1px rgba(255,255,255,.55),0 6px 18px rgba(0,0,0,.36),0 0 18px rgba(53,158,255,.6)}
.cx-jump span{flex:1;font-weight:600;font-size:14.5px;opacity:.85;margin-left:4px}
.cx-jump i{font-style:normal;font-size:22px}
.cx-list-h{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px;margin:26px 2px 6px;padding-top:14px;border-top:2px solid rgba(109,178,255,.45);font:800 22px/1.2 var(--display);scroll-margin-top:84px}
.cx-list-h span{font:600 14px var(--body);color:var(--muted)}
.cx-up{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 92px);z-index:6;padding:8px 16px;border-radius:999px;font:800 15px var(--body);color:#06172c;
  border:1px solid #a7e9ff;background:linear-gradient(145deg,#9be1ff,#4ba7ff 60%);box-shadow:0 6px 18px rgba(0,0,0,.45),0 0 14px rgba(53,158,255,.7)}
.cx-up[hidden]{display:none}
/* Catalogue : lignes compactes, filtres, fiche produit */
.cat-top{position:sticky;top:-1px;z-index:2;margin:0 -2px;padding:6px 2px 8px;background:var(--surface)}
dialog.sheet .cat-top{background:rgba(21,38,66,.97);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-radius:0 0 14px 14px}
.cat-filters{flex-wrap:nowrap;overflow-x:auto;touch-action:pan-x pan-y;margin-top:8px;padding-bottom:4px}
.cat-filters .chip{white-space:nowrap;flex:none}
.cat-list{border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;background:var(--surface)}
.cat-row{display:flex;align-items:center;border-top:1px solid var(--line);min-height:52px}
.cat-row:first-child{border-top:0}
.cat-rmain{all:unset;box-sizing:border-box;cursor:pointer;flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:8px 6px 8px 12px}
.cat-rem{font-size:24px;width:30px;text-align:center;flex:none}
.cat-rnm{flex:1;min-width:0;font-size:16px;font-weight:600;line-height:1.25}

/* V3 — Harmonisation des boutons Explorer et Ajouter avec Notre maison.
   Purement visuel : les attributs data-act/data-v et les handlers restent inchangés. */
main:has(.group-h) .sq-grid,
dialog.sheet:has(.sq[data-act="pickPhotos"]) .sq-grid{
 display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;
 margin-block:12px 20px!important;align-items:stretch;
}
main:has(.group-h) .sq,
dialog.sheet:has(.sq[data-act="pickPhotos"]) .sq{
 display:flex;flex-direction:column;align-items:center;justify-content:center;
 min-width:0;min-height:106px;padding:12px 7px;gap:9px;
 border:1px solid rgba(120,213,255,.85);border-radius:17px;
 background:linear-gradient(145deg,#245b94,#102c51 75%);
 box-shadow:inset 0 2px 2px #e2f7ff66,inset 0 -8px 18px #04132c88,0 0 10px #43b8ff9c,0 0 24px #167bdb55;
 color:#f4faff;transition:transform .15s ease,box-shadow .15s ease;
}
main:has(.group-h) .sq-ic,
dialog.sheet:has(.sq[data-act="pickPhotos"]) .sq-ic{
 width:52px;height:52px;flex:0 0 52px;border-radius:14px;
 border:1px solid #72c9ff99;background:linear-gradient(145deg,#315c92,#172c51);
 box-shadow:inset 0 2px 2px #d3efff44,0 0 13px #399dff80;
}
main:has(.group-h) .sq-ic .mi svg,
dialog.sheet:has(.sq[data-act="pickPhotos"]) .sq-ic .mi svg{width:30px;height:30px}
main:has(.group-h) .sq-t,
dialog.sheet:has(.sq[data-act="pickPhotos"]) .sq-t{
 color:#f5fbff;font-size:12px;font-weight:700;line-height:1.25;
 white-space:normal;overflow-wrap:anywhere;text-align:center;
 max-width:100%;overflow:visible;text-overflow:clip;
}
dialog.sheet:has(.sq[data-act="pickPhotos"]){max-width:min(850px,calc(100vw - 20px));}
dialog.sheet:has(.sq[data-act="pickPhotos"]) .sheet-in{padding-bottom:22px}
dialog.sheet:has(.sq[data-act="pickPhotos"]) .sq-grid{grid-template-columns:repeat(5,minmax(0,1fr))}
@media(max-width:750px){
 main:has(.group-h) .sq-grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}
 dialog.sheet:has(.sq[data-act="pickPhotos"]) .sq-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
 main:has(.group-h) .sq,dialog.sheet:has(.sq[data-act="pickPhotos"]) .sq{min-height:92px;padding:9px 4px}
 main:has(.group-h) .sq-ic,dialog.sheet:has(.sq[data-act="pickPhotos"]) .sq-ic{width:44px;height:44px;flex-basis:44px}
 main:has(.group-h) .sq-t,dialog.sheet:has(.sq[data-act="pickPhotos"]) .sq-t{font-size:11px}
}
@media(max-width:365px){
 main:has(.group-h) .sq-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
}

<script>
// iOS : garder chaque champ des formulaires au-dessus du clavier.
// visualViewport décrit la zone réellement visible, même dans une PWA installée.
(() => {
  const vv = window.visualViewport;
  const sheet = document.getElementById('sheet');
  if (!vv || !sheet) return;
  const editable = el => el && el.matches('input:not([type=checkbox]):not([type=radio]):not([type=hidden]), textarea, select, [contenteditable="true"]');
  let timer;
  function adjust() {
    const keyboard = window.innerHeight - vv.height > 130;
    document.documentElement.style.setProperty('--maison-vh', Math.max(180, vv.height - 12) + 'px');
    if (sheet.open && keyboard) {
      sheet.classList.add('maison-keyboard');
      sheet.style.top = Math.max(0, vv.offsetTop + 6) + 'px';
      sheet.style.height = Math.max(180, vv.height - 12) + 'px';
      sheet.style.maxHeight = Math.max(180, vv.height - 12) + 'px';
    } else {
      sheet.classList.remove('maison-keyboard');
      sheet.style.removeProperty('top');
      sheet.style.removeProperty('height');
      sheet.style.removeProperty('max-height');
    }
  }
  function showFocused() {
    adjust();
    const field = document.activeElement;
    if (!sheet.open || !sheet.contains(field) || !editable(field)) return;
    const r = field.getBoundingClientRect(), b = sheet.getBoundingClientRect();
    if (r.bottom > b.bottom - 24) sheet.scrollTop += r.bottom - b.bottom + 24;
    else if (r.top < b.top + 18) sheet.scrollTop -= b.top + 18 - r.top;
  }
  vv.addEventListener('resize', () => { adjust(); clearTimeout(timer); timer=setTimeout(showFocused, 130); }, {passive:true});
  vv.addEventListener('scroll', adjust, {passive:true});
  document.addEventListener('focusin', e => { if (!sheet.contains(e.target) || !editable(e.target)) return; setTimeout(showFocused, 100); setTimeout(showFocused, 350); });
  document.addEventListener('focusout', () => setTimeout(adjust, 300));
  sheet.addEventListener('close', adjust);
  window.addEventListener('orientationchange', () => setTimeout(adjust, 250));
  adjust();
})();
</script>
